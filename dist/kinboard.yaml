# The one source for every app-store listing (RFC-024 §7).
#
# Edit this file, then run
#
#   node scripts/stores/build-store-listings.mjs
#
# and commit dist/ together with it. Every file under dist/<store>/ is generated
# from this file, from compose.yml (the services) and from
# .github/workflows/docker.yml (the image names); CI fails when one of them is
# out of date (`--check`). Nothing here is a secret, and nothing may be: every
# listing is public.
#
# The product's name is written here and nowhere else in the listings or the
# generator. How listings are produced and rehearsed: dist/README.md.

schema: 1

name: Kinboard
# Lowercase, kebab-case: Umbrel's and TrueNAS's app id, the folder data lives
# in, and the prefix of compose.yml's container and volume names.
slug: kinboard
# Reverse-domain id (CasaOS/ZimaOS requires one).
id: app.kinboard
# owner/name on GitHub. The images' owner and every GitHub link derive from it.
repository: svenger87/kinboard

tagline:
  en: Your family's day, on one screen
  de: Der Tag deiner Familie auf einem Bildschirm

description:
  # The repository's description (OCI description, Portainer); under 512
  # characters, GHCR's limit for the description annotation.
  short: >-
    Self-hosted family dashboard for kitchen wall displays: calendars, shopping,
    weather, photos, smart home, energy and daily life in one screen.
  long:
    en: >-
      Kinboard is a self-hosted family dashboard, built for a touchscreen on the
      kitchen wall and every phone in the house. Calendars (Google, CalDAV and
      iCal), meals and recipes, shopping lists, tasks, chores and rewards, a
      photo screensaver, weather, and your smart home through Home Assistant,
      on one screen everyone in the family can use.


      Everything stays on your own hardware. There is no account to create and
      no cloud service in between: the first device creates the family, and
      every other device joins it with the family's code.
    de: >-
      Kinboard ist ein selbst gehostetes Familien-Dashboard, gemacht für einen
      Touchscreen an der Küchenwand und für jedes Handy im Haus. Kalender
      (Google, CalDAV und iCal), Essensplan und Rezepte, Einkaufslisten,
      Aufgaben, Haushaltspflichten und Belohnungen, ein Foto-Bildschirmschoner, das Wetter
      und euer Smart Home über Home Assistant, auf einem Bildschirm, den die
      ganze Familie bedienen kann.


      Alles bleibt auf eurer eigenen Hardware. Es gibt kein Konto anzulegen und
      keinen Cloud-Dienst dazwischen: Das erste Gerät legt die Familie an, jedes
      weitere tritt ihr mit dem Familiencode bei.

# Shown before or right after the install (CasaOS `tips`, the TrueNAS README,
# Portainer's note, Umbrel's description).
first_run:
  en: >-
    Open the app and create your family; every other device joins with the
    family's code. The passwords and keys create themselves on the first start
    and are kept in the config folder: back up all three folders together, and
    keep the backups private.
  de: >-
    Öffne die App und lege deine Familie an; jedes weitere Gerät tritt mit dem
    Familiencode bei. Passwörter und Schlüssel entstehen beim ersten Start von
    selbst und liegen im Config-Ordner: Sichere alle drei Ordner zusammen und
    halte die Sicherungen privat.

# One internal list, mapped to each store's own taxonomy below.
categories: [home, productivity]
store_categories:
  casaos: Home              # fixed list: docs/specs/compose-and-x-casaos.md
  umbrel: automation        # VALID_CATEGORIES in .tools/lint-apps.mjs
  truenas: productivity     # exactly one (generate_metadata.py)
  portainer: [Productivity, Home]

keywords: [family, calendar, dashboard, kiosk, shopping list, home assistant]

icon:
  png: assets/logos/kinboard-logo-icon-512.png
  svg: webapp/public/icons/icon-512.svg

# From the wiki for now (RFC-024 §11.8: a dedicated set from the screen matrix
# replaces them later). Light theme.
screenshots:
  - docs/wiki/images/dashboard-portrait-light.png
  - docs/wiki/images/calendar-month-view-light.png
  - docs/wiki/images/meals-week-board-light.png
  - docs/wiki/images/shopping-list-mixed-light.png
  - docs/wiki/images/todos-overview-light.png
  - docs/wiki/images/screensaver-designed.png

links:
  website: https://kinboard.app
  # Relative to https://github.com/<repository>.
  docs: wiki
  support: discussions
  changelog: releases
  security: blob/main/SECURITY.md

# SPDX, the same as webapp/package.json's "license" (a check holds them equal).
license: PolyForm-Noncommercial-1.0.0

# A GitHub account, never a personal email address.
maintainer:
  name: svenger87
  url: https://github.com/svenger87

ports:
  # The web UI. container is what the webapp listens on (compose.yml).
  web:
    container: 3000
    host: 3001
    # Unique across Umbrel's store (checked by its linter).
    umbrel: 3388
    # TrueNAS's convention: a high port of the app's own.
    truenas: 31088
  # go2rtc's WebRTC port, for cameras; the same on the host.
  webrtc:
    container: 8555
    host: 8555
    protocol: udp

# compose.yml's three volumes, by the part of their name after "<slug>-".
volumes:
  db:
    label: Database
    description: every family, calendar, list and setting
  storage:
    label: Uploaded files
    description: family photos, recipe pictures, vehicle images
  config:
    label: Configuration and secrets
    description: the database password, the key that signs logins, the push keys
# Where each store keeps them. {slug} and {volume} are filled in.
volume_paths:
  casaos: /DATA/AppData/{slug}/{volume}
  umbrel: ${APP_DATA_DIR}/data/{volume}
  synology: /volume1/docker/{slug}/{volume}
  unraid: /mnt/user/appdata/{slug}/{volume}

# The optional variables a household may set (RFC-023 §4.6), by compose.yml's
# variable name. `default` overrides compose.yml's for every store; `stores`
# overrides per store. Anything compose.yml reads that is not listed here takes
# compose.yml's default, and is left out when that default is empty.
env:
  TZ:
    label: Time zone
    default: Europe/Berlin
  SITE_URL:
    label: Address other apps get in links (calendar feed); empty means the address the page was opened at
    advanced: true
  WEBRTC_LAN_IP:
    label: This machine's LAN address, for cameras over WebRTC
    advanced: true
  PUID:
    label: User that owns the uploaded files
    default: "1000"
  PGID:
    label: Group that owns the uploaded files
    default: "1000"
  INSTANCE_ADMIN_FAMILY_ID:
    label: The family that sees update notices, when there is more than one
    advanced: true

# Services of compose.yml a store listing leaves out, per store, and why. A
# service with a profile (compose.yml's opt-ins) must be either left out here
# or offered under `opt_in` for every store.
omit_services:
  # The automatic updater, which needs the Docker socket (RFC-024 §4.7).
  updater:
    truenas: TrueNAS offers the app's update itself, from the catalog's new version
    casaos: CasaOS offers the update itself when the listing's version changes
    umbrel: Umbrel offers the update itself when the manifest's version changes, and forbids the Docker socket

# compose.yml's profiles a listing keeps, off until the household switches
# them on, with the field that does it. Only Portainer: it has no update
# mechanism of its own for a template's stack that takes a backup and rolls
# back, so the updater in container mode (RFC-023 §4.11.3) is its update path.
# The profile's services, and the Docker socket with them, don't start unless
# the field is on.
opt_in:
  autoupdate:
    stores: [portainer]
    label: Automatic updates
    description: >-
      On starts the updater: every 30 minutes it looks for a newer image of the
      image tag, takes a verified backup, recreates only the app's containers
      and goes back to the previous version if the new one doesn't come up
      healthy. A pinned version never moves. It is the only container that gets
      the Docker socket, and only when this is on. Switched off later, the
      running updater stays until you remove kinboard-updater under Containers.
    off: "Off"
    on: On, with the Docker socket in the updater container

# The all-in-one image (RFC-024 §4.2, phase 5): one container, one data folder.
# Its listings (the Unraid template, Portainer's single-container template)
# take the image's name and channel tags from docker.yml (AIO_IMAGE_NAME,
# AIO_IMAGE_TAGS) and everything they say from here and from the keys above.
aio:
  # The one volume, inside the container.
  data: /data
  # Docker's stop timeout. PostgreSQL has 30 s to shut down cleanly inside
  # (s6's timeout-down); Docker's default of 10 s would kill it mid-checkpoint.
  stop_timeout: 60
  # Variables of `env` above that mean nothing in the all-in-one image.
  env_exclude: [WEBRTC_LAN_IP]
  # Variables only the all-in-one image reads.
  env:
    PUID:
      label: User that runs Kinboard and owns its data folder
      default: "1000"
    PGID:
      label: Group that owns the data folder
      default: "1000"
    GO2RTC_URL:
      label: Address of a separate go2rtc container, for RTSP cameras (snapshot and MJPEG cameras work without it)
      advanced: true
    # The scheduled backups (wiki: All-in-one, Backups). Empty: chosen in
    # Settings → Data & safety, off until switched on there. Set, the
    # server's value wins and Settings shows it as set by the server, so the
    # template's default stays empty (a default of "off" would lock Settings).
    KINBOARD_BACKUP_SCHEDULE:
      label: "Automatic backups: off, daily or weekly. Leave empty to choose in Settings, Data & safety"
    KINBOARD_BACKUP_TIME:
      label: Time of the automatic backup, HH:MM in the time zone above (empty is 03:00)
      advanced: true
    KINBOARD_BACKUP_DAY:
      label: Day of a weekly backup, mon to sun (empty is sun)
      advanced: true
    KINBOARD_BACKUP_KEEP:
      label: How many automatic backups to keep (empty is 7)
      advanced: true
  # The optional second folder: where the scheduled backups go when mapped
  # (empty: /data/backups/scheduled, on the same disk as everything else).
  # The image uses it when something is mounted there.
  backups:
    target: /backups
    label: Backups (optional)
    description: >-
      A folder on another disk for the automatic backups, for example
      /mnt/user/backups/kinboard on a share that is not on the data folder's
      disk. Empty keeps them in the data folder, which a failing disk takes
      with it. Each backup holds every family's data and keys: keep the
      folder private.
  # Shown before or right after the install, in place of first_run (which
  # speaks of compose's three folders).
  first_run:
    en: >-
      Open the app and create your family; every other device joins with the
      family's code. The passwords and keys create themselves on the first
      start and are kept in the data folder.
  # What the all-in-one image needs besides itself (CA's Requires).
  requires:
    en: >-
      amd64 or arm64. Nothing else: PostgreSQL and PostgREST run inside the
      container. RTSP cameras need a separate go2rtc container.
  # Said in every all-in-one listing.
  note:
    en: >-
      Everything runs in this one container: the app, its PostgreSQL database
      and the scheduled jobs. Give it one folder for its data; back up that
      folder, and keep the backups private. go2rtc is not included: snapshot
      and MJPEG cameras work without it, and RTSP cameras need a separate
      go2rtc container (set GO2RTC_URL).
  # The Unraid Community Applications template (RFC-024 §5.1, §11.9). It
  # lives in its own repository, which holds only the generated files under
  # dist/unraid/ (ca_profile.xml at its root, the template in templates/).
  unraid:
    repository: svenger87/kinboard-unraid
    # CA's "Category:Subcategory" list, space-separated (the starter template
    # names the Application Categorizer plugin as the source of valid values;
    # to confirm there before any submission).
    category: "HomeAutomation: Productivity:"
    # Not /mnt/user/appdata/{slug}: that is where Self-hosting puts a git
    # install, and the image refuses a folder holding another install's
    # database. A household with both keeps them apart.
    data_path: /mnt/user/appdata/{slug}-aio
    puid: "99"
    pgid: "100"
    min_version: "6.12"
    # The second, optional template: the updater beside the all-in-one
    # container (RFC-024 §4.7). Its name, entrypoint, own variables and state
    # folder come from compose.yml's `updater` service; these are the two
    # variables only the all-in-one case needs, as kinboard-self-update.sh
    # reads them: the container it looks after, and the switch that pauses it.
    updater:
      category: "Tools:"
      container_env: KINBOARD_AIO_CONTAINER
      switch_env: KINBOARD_UPDATE_TICK
    # Unraid 7's per-container "Use Tailscale" (the Docker page's hook,
    # /usr/local/share/docker/tailscale_container_hook): preset so the switch
    # alone gives an https://<hostname>.<tailnet>.ts.net address, and off
    # until the household turns it on. Serve, never Funnel: Serve stays inside
    # the tailnet, Funnel would put the whole app on the internet (wiki: HTTPS).
    # The Serve port is ports.web.container. Userspace networking needs no
    # /dev/net/tun and no NET_ADMIN. The state lives under aio.data, so it is
    # kept, and backed up, with everything else.
    tailscale:
      hostname: "{slug}"
      serve: serve
      serve_target: http://127.0.0.1
      serve_protocol: https
      userspace_networking: "true"
      state_dir: /data/tailscale
  # What needs HTTPS, and the switch that gives it. Said in the Unraid
  # template's Overview, followed by the wiki page's address.
  https:
    en: >-
      Push notifications, the barcode scanner's live camera and installing the
      app need an https address; everything else works over plain http on your
      network. Switch on "Use Tailscale" (Serve is preset) for an https address
      on your tailnet, reachable from your devices that run Tailscale; cloud AI
      assistants (ChatGPT, Claude.ai) can't reach it. Other ways, and what each
      means, on the wiki's HTTPS page:

# The release the pinned listings (TrueNAS, CasaOS, Umbrel) point at. Written by
#   node scripts/stores/pin-release.mjs <tag>
# never by hand: it resolves every image's multi-arch index digest from the
# registry. Until the first release that carries kinboard-postgres and the role
# bootstrap (1.18), this is a build of main, so the listings can be validated
# and rehearsed against images that exist; it is replaced before any
# submission (RFC-024 §9, phase 6).
release:
  version: 1.18.0-main.45e1152
  app_tag: sha-45e1152
  postgres_tag: 17-sha-45e1152
  digests:
