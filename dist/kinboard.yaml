    ghcr.io/svenger87/kinboard-postgres:17-sha-45e1152: sha256:78c77ef99ec25b7ef049cc3739f9a1e02b6c5a1c24d222f6a9a97ff607b1e377
    postgrest/postgrest:v14.16: sha256:bea1c76a856fa39d1e542d25911cf95d02fe2bf971992d033044ff209f1504b8
