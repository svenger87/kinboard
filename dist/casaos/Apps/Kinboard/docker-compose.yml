# Generated from dist/kinboard.yaml and compose.yml by scripts/stores/build-store-listings.mjs. Do not edit by hand.
name: kinboard
services:
  init:
    image: ghcr.io/svenger87/kinboard:sha-2e83c9f@sha256:a18e6874cdd961654364815562b2ba3b848bde25648d29905e0e61135189a498
    container_name: kinboard-init
    entrypoint:
      - /bin/sh
      - "-c"
      - if [ -x /usr/local/bin/kinboard-init ]; then exec /app/webapp-entrypoint.sh kinboard-init; fi; echo "This Kinboard image is older than 1.18 and can't run the one-file setup. Set KINBOARD_TAG to 1.18 or newer (or leave it unset)." >&2; exit 1
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: /DATA/AppData/kinboard/config
        target: /kinboard
      - type: bind
        source: /DATA/AppData/kinboard/db
        target: /kinboard-db
        read_only: true
    networks:
      - kinboard
  db:
    image: ghcr.io/svenger87/kinboard-postgres:17-sha-2e83c9f@sha256:c58ef7e1e2fe121efee8bf5b6277568ff7f6068831a2a439348dacf13c7c1388
    container_name: kinboard-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - "-U"
        - postgres
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD_FILE: /kinboard/secrets/postgres_password
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGDATABASE: postgres
      POSTGRES_DB: postgres
    volumes:
      - type: bind
        source: /DATA/AppData/kinboard/db
        target: /var/lib/postgresql/data
      - type: bind
        source: /DATA/AppData/kinboard/config
        target: /kinboard
        read_only: true
    networks:
      - kinboard
  db-init:
    image: ghcr.io/svenger87/kinboard:sha-2e83c9f@sha256:a18e6874cdd961654364815562b2ba3b848bde25648d29905e0e61135189a498
    container_name: kinboard-db-init
    command:
      - kinboard-db-init
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/kinboard/config
        target: /kinboard
        read_only: true
    networks:
      - kinboard
  rest:
    image: postgrest/postgrest:v14.16@sha256:bea1c76a856fa39d1e542d25911cf95d02fe2bf971992d033044ff209f1504b8
    container_name: kinboard-rest
    command: postgrest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: "@/kinboard/secrets/db_uri"
      PGRST_JWT_SECRET: "@/kinboard/secrets/jwt_secret"
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
    volumes:
      - type: bind
        source: /DATA/AppData/kinboard/config
        target: /kinboard
        read_only: true
    networks:
      - kinboard
  webapp:
    image: ghcr.io/svenger87/kinboard:sha-2e83c9f@sha256:a18e6874cdd961654364815562b2ba3b848bde25648d29905e0e61135189a498
    container_name: kinboard-webapp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - "-sf"
        - http://localhost:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rest:
        condition: service_started
    ports:
      - target: 3000
        published: "3001"
        protocol: tcp
    environment:
      TZ: Europe/Berlin
      SITE_URL: ""
      KINBOARD_SCHEDULER: internal
      KINBOARD_COMPOSE_REVISION: "1"
      POSTGREST_URL: http://rest:3000
      FILES_DIR: /var/lib/storage/files
      GO2RTC_URL: http://go2rtc:1984
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      PUID: "1000"
      PGID: "1000"
      INSTANCE_ADMIN_FAMILY_ID: ""
    volumes:
      - type: bind
        source: /DATA/AppData/kinboard/storage
        target: /var/lib/storage
      - type: bind
        source: /DATA/AppData/kinboard/config
        target: /kinboard
        read_only: true
    networks:
      - kinboard
  go2rtc:
    image: alexxit/go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
    container_name: kinboard-go2rtc
    command:
      - go2rtc
      - "-config"
      - "{webrtc: {candidates: ['$${WEBRTC_LAN_IP:}:8555', 'stun:8555']}}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - target: 8555
        published: "8555"
        protocol: udp
    environment:
      TZ: Europe/Berlin
      WEBRTC_LAN_IP: ""
    networks:
      - kinboard
networks:
  kinboard: {}
x-casaos:
  id: app.kinboard
  main: webapp
  index: /
  port_map: "3001"
  scheme: http
  icon: https://raw.githubusercontent.com/svenger87/kinboard/main/webapp/public/icons/icon-512.svg
  title:
    en_US: Kinboard
    de_DE: Kinboard
  tagline:
    en_US: Your family's day, on one screen
    de_DE: Der Tag deiner Familie auf einem Bildschirm
  description:
    en_US: |-
      Kinboard is a self-hosted family dashboard, built for a touchscreen on the kitchen wall and every phone in the house. Calendars (Google, CalDAV and iCal), meals and recipes, shopping lists, tasks, chores and rewards, a photo screensaver, weather, and your smart home through Home Assistant, on one screen everyone in the family can use.

      Everything stays on your own hardware. There is no account to create and no cloud service in between: the first device creates the family, and every other device joins it with the family's code.
    de_DE: |-
      Kinboard ist ein selbst gehostetes Familien-Dashboard, gemacht für einen Touchscreen an der Küchenwand und für jedes Handy im Haus. Kalender (Google, CalDAV und iCal), Essensplan und Rezepte, Einkaufslisten, Aufgaben, Haushaltspflichten und Belohnungen, ein Foto-Bildschirmschoner, das Wetter und euer Smart Home über Home Assistant, auf einem Bildschirm, den die ganze Familie bedienen kann.

      Alles bleibt auf eurer eigenen Hardware. Es gibt kein Konto anzulegen und keinen Cloud-Dienst dazwischen: Das erste Gerät legt die Familie an, jedes weitere tritt ihr mit dem Familiencode bei.
  tips:
    before_install:
      en_US: "Open the app and create your family; every other device joins with the family's code. The passwords and keys create themselves on the first start and are kept in the config folder: back up all three folders together, and keep the backups private."
      de_DE: "Öffne die App und lege deine Familie an; jedes weitere Gerät tritt mit dem Familiencode bei. Passwörter und Schlüssel entstehen beim ersten Start von selbst und liegen im Config-Ordner: Sichere alle drei Ordner zusammen und halte die Sicherungen privat."
  screenshot_link:
    - https://raw.githubusercontent.com/svenger87/kinboard/main/docs/wiki/images/dashboard-portrait-light.png
    - https://raw.githubusercontent.com/svenger87/kinboard/main/docs/wiki/images/calendar-month-view-light.png
    - https://raw.githubusercontent.com/svenger87/kinboard/main/docs/wiki/images/meals-week-board-light.png
    - https://raw.githubusercontent.com/svenger87/kinboard/main/docs/wiki/images/shopping-list-mixed-light.png
    - https://raw.githubusercontent.com/svenger87/kinboard/main/docs/wiki/images/todos-overview-light.png
    - https://raw.githubusercontent.com/svenger87/kinboard/main/docs/wiki/images/screensaver-designed.png
  author: svenger87
  developer: svenger87
  category: Home
  architectures:
    - amd64
    - arm64
  version: 1.18.0-main.2e83c9f
  website: https://kinboard.app
  repo: https://github.com/svenger87/kinboard
  support: https://github.com/svenger87/kinboard/discussions
  docs: https://github.com/svenger87/kinboard/wiki
