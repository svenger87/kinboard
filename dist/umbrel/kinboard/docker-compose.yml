# Generated from dist/kinboard.yaml and compose.yml by scripts/stores/build-store-listings.mjs. Do not edit by hand.
services:
  app_proxy:
    environment:
      APP_HOST: kinboard_webapp_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: /api/*
  init:
    image: ghcr.io/svenger87/kinboard:sha-45e1152@sha256:5f3c9e309e1dd65bd6f0b7fd8b6de4e0ec4e3c4084e194c6c7235b424ad1bfb2
    entrypoint:
      - /bin/sh
      - "-c"
      - if [ -x /usr/local/bin/kinboard-init ]; then exec /app/webapp-entrypoint.sh kinboard-init; fi; echo "This Kinboard image is older than 1.18 and can't run the one-file setup. Set KINBOARD_TAG to 1.18 or newer (or leave it unset)." >&2; exit 1
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      disable: true
    environment:
      POSTGRES_HOST: kinboard_db_1
    volumes:
      - ${APP_DATA_DIR}/data/config:/kinboard
      - ${APP_DATA_DIR}/data/db:/kinboard-db:ro
  db:
    image: ghcr.io/svenger87/kinboard-postgres:17-sha-45e1152@sha256:78c77ef99ec25b7ef049cc3739f9a1e02b6c5a1c24d222f6a9a97ff607b1e377
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - "-U"
        - postgres
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD_FILE: /kinboard/secrets/postgres_password
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGDATABASE: postgres
      POSTGRES_DB: postgres
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
      - ${APP_DATA_DIR}/data/config:/kinboard:ro
  db-init:
    image: ghcr.io/svenger87/kinboard:sha-45e1152@sha256:5f3c9e309e1dd65bd6f0b7fd8b6de4e0ec4e3c4084e194c6c7235b424ad1bfb2
    command:
      - kinboard-db-init
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: kinboard_db_1
    volumes:
      - ${APP_DATA_DIR}/data/config:/kinboard:ro
  rest:
    image: postgrest/postgrest:v14.16@sha256:bea1c76a856fa39d1e542d25911cf95d02fe2bf971992d033044ff209f1504b8
    command: postgrest
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: "@/kinboard/secrets/db_uri"
      PGRST_JWT_SECRET: "@/kinboard/secrets/jwt_secret"
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
    volumes:
      - ${APP_DATA_DIR}/data/config:/kinboard:ro
  webapp:
    image: ghcr.io/svenger87/kinboard:sha-45e1152@sha256:5f3c9e309e1dd65bd6f0b7fd8b6de4e0ec4e3c4084e194c6c7235b424ad1bfb2
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - "-sf"
        - http://localhost:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rest:
        condition: service_started
    environment:
      TZ: Europe/Berlin
      SITE_URL: ""
      KINBOARD_SCHEDULER: internal
      KINBOARD_COMPOSE_REVISION: "1"
      POSTGREST_URL: http://kinboard_rest_1:3000
      FILES_DIR: /var/lib/storage/files
      GO2RTC_URL: http://kinboard_go2rtc_1:1984
      POSTGRES_HOST: kinboard_db_1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      PUID: "1000"
      PGID: "1000"
      INSTANCE_ADMIN_FAMILY_ID: ""
    volumes:
      - ${APP_DATA_DIR}/data/storage:/var/lib/storage
      - ${APP_DATA_DIR}/data/config:/kinboard:ro
  go2rtc:
    image: alexxit/go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
    command:
      - go2rtc
      - "-config"
      - "{webrtc: {candidates: ['$${WEBRTC_LAN_IP:}:8555', 'stun:8555']}}"
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - 8555:8555/udp
    environment:
      TZ: Europe/Berlin
      WEBRTC_LAN_IP: ""
