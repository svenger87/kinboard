events { worker_connections 1024; }

http {
    # Without this, nginx serves .svg with Content-Type: text/plain,
    # and the webapp's camera proxy passes that through unchanged —
    # the browser then refuses to render the response as an image
    # ("Stream konnte nicht geladen werden"). The standard mime.types
    # file ships in the nginx:alpine image.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Map the ?src= query param to a per-camera SVG so each demo
    # camera shows scene-themed animated content instead of one
    # placeholder. Falls back to the generic stream for unknown src.
    map $arg_src $demo_stream {
        demo_kitchen     /demo-kitchen.svg;
        demo_garden      /demo-garden.svg;
        demo_front_door  /demo-front-door.svg;
        default          /demo-stream.svg;
    }

    server {
        # Match real go2rtc HTTP port so the same internal URL
        # (`http://go2rtc:1984/...`) works whether the demo overlay or
        # the real go2rtc service is fronting cameras.
        listen 1984;
        server_name localhost;

        # Mock the go2rtc API surface enough that Kinboard's cameras
        # config page + cameras grid page render with believable data.

        location = /api/streams {
            default_type application/json;
            return 200 '{"demo_kitchen":{"name":"demo_kitchen"},"demo_garden":{"name":"demo_garden"},"demo_front_door":{"name":"demo_front_door"}}';
        }

        location /api/frame.mp4 {
            default_type image/svg+xml;
            return 302 $demo_stream;
        }

        # MJPEG fallback — Kinboard requests /api/stream.mjpeg?src=NAME.
        # Resolves the per-camera animated SVG via the `map` above so
        # each camera shows scene-themed footage.
        location /api/stream.mjpeg {
            default_type image/svg+xml;
            return 302 $demo_stream;
        }

        # Static SVG that doubles as a placeholder for any stream URL.
        location = /demo-stream.svg {
            alias /usr/share/nginx/html/demo-stream.svg;
            add_header Cache-Control "no-cache";
        }

        # Fallback for any other go2rtc API path — return empty 200 so
        # Kinboard doesn't error out on probes.
        location /api/ {
            default_type application/json;
            return 200 '{}';
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/index.html =404;
        }
    }
}
