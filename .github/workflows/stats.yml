name: Usage stats

# Snapshots GitHub's own traffic figures into stats/traffic.json once a
# day, because the traffic API only ever returns the last 14 days and
# keeps no history. Without this, every day that passes is a day of data
# gone permanently.
#
# This is NOT telemetry. Nothing is collected from Kinboard installs —
# these are GitHub's numbers about github.com, read back by the repo
# owner. The "no telemetry" promise in README.md, Architecture.md and on
# kinboard.app stays literally true.

on:
  schedule:
    # 03:17 UTC — an odd minute, because the top of the hour is when
    # every cron on GitHub fires at once and jobs get queued.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect
        env:
          # Traffic endpoints require push access; the workflow token has
          # it via `contents: write`. The script degrades to public-only
          # stats rather than failing if that ever stops being true.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/collect-stats.mjs

      - name: Render summary
        run: node scripts/render-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(stats): daily traffic snapshot"
            git push
          fi
