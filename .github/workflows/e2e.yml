name: E2E smoke

# Boots the full Kinboard docker stack with the demo overlay (mock HA /
# Tesla / weather / cameras), seeds the demo family, and runs the
# Playwright smoke suite against http://localhost:3001.
#
# Phase B of the testing plan — the suite itself shipped in v1.0.9
# (webapp/e2e/smoke.spec.ts) and has been run manually against demo +
# prod since. This workflow makes it a per-PR / per-main-push gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions for the GITHUB_TOKEN — the smoke run boots the
# stack locally on the runner and reads test artifacts; nothing writes
# back to the repo or comments on PRs.
permissions:
  contents: read

# Cancel in-progress runs on the same ref — booting the stack is slow,
# no point doubling up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Boot stack + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40  # cold cache plus the WebKit layout run: ~25-30 min
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      # npm 10 (bundled with Node 20) and npm 11 disagree on lockfile
      # shape, and `npm ci` on the wrong one fails outright. Corepack
      # reads `packageManager` from webapp/package.json so the version
      # is pinned in exactly one place. Plain `corepack enable` does
      # NOT shim npm — the explicit `npm` argument is required.
      - name: Use the pinned npm
        run: corepack enable npm

      - name: Install webapp deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          # The suffix is part of the key because the cache is keyed only on the
          # lockfile, and adding a browser does not change the lockfile. Without
          # it, a cache saved when only Chromium was installed would be restored
          # for ever and WebKit re-downloaded on every run.
          key: pw-${{ runner.os }}-chromium-webkit-${{ hashFiles('webapp/package-lock.json') }}

      - name: Install Playwright browsers
        # --with-deps installs the system libs each browser needs at runtime —
        # libnss3/libgbm for Chromium, and nine more (libwoff1, libhyphen0,
        # libmanette, gstreamer plugins…) for WebKit.
        #
        # WebKit is here because both Playwright viewports are Chromium, so a
        # rule Chromium honours and WebKit ignores passes everything. That is
        # not hypothetical: `min-height: min-content` fixed the dashboard hero
        # overlap in Chromium and did nothing in WebKit, so rc.20 shipped
        # "fixed" and was still broken on every Mac and iPad until a user
        # reported it from Safari.
        run: npx playwright install --with-deps chromium webkit

      - name: Generate stack secrets non-interactively
        working-directory: ${{ github.workspace }}
        run: bash setup.sh --non-interactive --force

      - name: Wire demo overlay + KINBOARD_DEMO_FAMILY_CODE
        working-directory: ${{ github.workspace }}/webapp/docker
        run: |
          cp docker-compose.demo.yml.example docker-compose.demo.yml
          # setup.sh leaves KINBOARD_DEMO_FAMILY_CODE blank; the demo
          # overlay needs it set so the demo-only API surfaces light up.
          awk '
            /^KINBOARD_DEMO_FAMILY_CODE=/ { print "KINBOARD_DEMO_FAMILY_CODE=DEMO01"; next }
            { print }
          ' .env > .env.tmp && mv .env.tmp .env
          # CI never asks the real OpenHolidays API for anything: the demo
          # seed turns the school-holiday sync on, and this turns the install
          # off (RFC-014 §5.4). setup.sh copied an empty SCHOOL_HOLIDAY_SYNC=
          # from .env.example; drop it so the file has exactly one value.
          sed -i '/^SCHOOL_HOLIDAY_SYNC=/d' .env
          echo "SCHOOL_HOLIDAY_SYNC=off" >> .env
          # Every spec joins its own device from the runner's one IP; the
          # production cap of 10 joins a minute made the WebKit run flaky.
          echo "SESSION_RATE_LIMIT_PER_MINUTE=1000" >> .env

      - name: Boot stack with demo overlay
        working-directory: ${{ github.workspace }}/webapp/docker
        env:
          COMPOSE_FILES: "-f docker-compose.yml -f docker-compose.demo.yml"
        run: bash start.sh up

      - name: Wait for stack health
        # Polls the webapp's /api/setup/status — it requires kong + webapp
        # + postgrest + db to all be working, so it's a single-call check
        # for "the whole stack is ready". 90 attempts * 5s = 7.5 min budget.
        run: |
          for i in $(seq 1 90); do
            if curl -sfo /dev/null --max-time 3 http://localhost:3001/api/setup/status; then
              echo "✓ stack ready (attempt $i)"
              exit 0
            fi
            echo "  waiting for stack... ($i/90)"
            sleep 5
          done
          echo "✗ stack did not become ready in 7.5 min"
          exit 1

      # A readiness timeout with no logs is unactionable — it tells you that
      # something didn't come up, not what. Capture the state before teardown.
      - name: Diagnose a stack that never came up
        if: failure()
        working-directory: ${{ github.workspace }}/webapp/docker
        env:
          COMPOSE_FILES: "-f docker-compose.yml -f docker-compose.demo.yml"
        run: |
          echo "::group::container states"
          docker compose $COMPOSE_FILES ps -a || true
          echo "::endgroup::"
          for svc in db webapp kong rest auth storage realtime; do
            echo "::group::logs: $svc"
            docker compose $COMPOSE_FILES logs --tail=100 "$svc" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Re-run migrations (belt-and-suspenders for first-boot race)
        # During local-dev verification we hit a race where migration.sql
        # (the original, no-suffix file) didn't apply on the very first
        # boot, leaving devices.hardware_id missing. Symptom: PostgREST
        # 400 on every /api/devices?hardware_id=eq.* call. Re-running
        # migrate is idempotent and catches up.
        working-directory: ${{ github.workspace }}/webapp/docker
        run: bash start.sh migrate

      - name: Seed demo family
        # Writes the DEMO01 family + HA/cameras/Tesla settings rows that
        # wire the demo family to the mock containers' URLs.
        working-directory: ${{ github.workspace }}/webapp/docker
        run: bash start.sh seed-demo

      # calendar-layout.spec.ts is pure logic (no browser, no stack) but
      # rides along here because Playwright is the only test runner in
      # the project — it costs a couple of seconds.
      #
      # pocket-money-live and event-search-live call the SQL functions and
      # PostgREST directly with the service role, which is the only place CI
      # runs migration_zzzzz_pocket_money_booking.sql's guards (overdraw,
      # allowance claim, double decide) against a real database; the fast
      # suite drives them through fakes. They read the key and Kong's port
      # from the .env setup.sh just wrote, exported for this step only.
      - name: Run smoke suite
        env:
          FAMILY_CODE: DEMO01
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          PLAYWRIGHT_DEVICE_NAME: "CI Smoke (GH Actions)"
        run: |
          SUPABASE_SERVICE_ROLE_KEY="$(grep -E '^SERVICE_ROLE_KEY=' docker/.env | head -n1 | cut -d= -f2- | tr -d '"\r')"
          KONG_PORT="$(grep -E '^KONG_HTTP_PORT=' docker/.env | head -n1 | cut -d= -f2- | tr -d '"\r')"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          export SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL="http://localhost:${KONG_PORT:-8100}"
          npx playwright test e2e/smoke.spec.ts e2e/calendar-layout.spec.ts e2e/realtime-publication.spec.ts e2e/rls-coverage.spec.ts e2e/catalogue-migration.spec.ts e2e/health-endpoint.spec.ts e2e/home-hero-layout.spec.ts e2e/dialog-ceiling-layout.spec.ts e2e/timer-widget-layout.spec.ts e2e/media-widget-layout.spec.ts e2e/messages-broadcast.spec.ts e2e/message-state.spec.ts e2e/rooms-migration.spec.ts e2e/automation-layout.spec.ts e2e/media-browse-flow.spec.ts e2e/meal-plan-read-only.spec.ts e2e/oauth-migration.spec.ts e2e/mcp-oauth-flow.spec.ts e2e/soft-delete-integration.spec.ts e2e/pocket-money-live.spec.ts e2e/event-search-live.spec.ts e2e/holiday-region-ui.spec.ts e2e/holiday-widget-ui.spec.ts e2e/school-sync-ui.spec.ts e2e/holiday-region-migration.spec.ts e2e/school-holiday-sync-db.spec.ts e2e/school-holidays-grants.spec.ts e2e/todo-turns-db.spec.ts e2e/family-delete-db.spec.ts e2e/todo-turns-ui.spec.ts e2e/camera-takeover-grants.spec.ts e2e/route-transition-layout.spec.ts e2e/calendar-day-tap-layout.spec.ts e2e/holiday-widgets-ui.spec.ts e2e/timetable-holidays-ui.spec.ts e2e/schedule-page-holidays-ui.spec.ts e2e/calendar-school-holidays-ui.spec.ts e2e/time-zone-ui.spec.ts e2e/settings-search-ui.spec.ts e2e/timer-pause-ui.spec.ts e2e/timer-presets-ui.spec.ts e2e/timer-alarm-ui.spec.ts e2e/pocket-money-grants.spec.ts e2e/creature-reactions-live.spec.ts e2e/creature-mood-live.spec.ts e2e/creatures-migration.spec.ts e2e/creatures-live.spec.ts e2e/creatures-surfaces-live.spec.ts e2e/device-owner-db.spec.ts e2e/device-owner-pin.spec.ts e2e/emoji-picker-ui.spec.ts --project=desktop

      # A separate step so a WebKit-only failure reads as one at a glance rather
      # than as "the smoke suite is flaky". Most of the suite reads source files
      # and would be paid for twice for nothing, so only what renders runs here.
      #
      # Smoke is covered by the desktop job above; this one is limited to
      # browser-engine-specific layout checks.
      - name: Run layout specs under WebKit
        env:
          FAMILY_CODE: DEMO01
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          PLAYWRIGHT_DEVICE_NAME: "CI WebKit (GH Actions)"
        run: npx playwright test e2e/home-hero-layout.spec.ts e2e/dialog-ceiling-layout.spec.ts e2e/timer-widget-layout.spec.ts e2e/media-widget-layout.spec.ts e2e/messages-broadcast.spec.ts e2e/automation-layout.spec.ts e2e/holiday-region-ui.spec.ts e2e/time-zone-ui.spec.ts e2e/holiday-widget-ui.spec.ts e2e/school-sync-ui.spec.ts e2e/route-transition-layout.spec.ts e2e/calendar-day-tap-layout.spec.ts e2e/holiday-widgets-ui.spec.ts e2e/timetable-holidays-ui.spec.ts e2e/schedule-page-holidays-ui.spec.ts e2e/calendar-school-holidays-ui.spec.ts e2e/settings-search-ui.spec.ts e2e/creatures-surfaces-live.spec.ts e2e/emoji-picker-ui.spec.ts --project=webkit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: webapp/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: webapp/e2e/results/
          retention-days: 7

      - name: Capture container logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}/webapp/docker
        run: |
          mkdir -p /tmp/stack-logs
          for c in $(docker ps -a --filter "name=kinboard-" --format "{{.Names}}"); do
            docker logs "$c" > /tmp/stack-logs/"$c".log 2>&1 || true
          done
          docker compose -f docker-compose.yml -f docker-compose.demo.yml ps > /tmp/stack-logs/ps.txt

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs-${{ github.run_attempt }}
          path: /tmp/stack-logs/
          retention-days: 7

      - name: Tear down stack
        if: always()
        working-directory: ${{ github.workspace }}/webapp/docker
        env:
          COMPOSE_FILES: "-f docker-compose.yml -f docker-compose.demo.yml"
        run: docker compose $COMPOSE_FILES down -v || true
