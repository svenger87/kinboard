name: Docker image

# Builds + pushes the webapp image to GitHub Container Registry on every
# push to main and on tagged releases. Multi-arch (amd64 + arm64) so
# self-hosters on Raspberry Pi-class hardware can `docker pull` instead
# of building locally.
#
# Image: ghcr.io/svenger87/kinboard
#
# Tag scheme:
#   - main branch → :main, :latest, :sha-<short>
#   - v1.2.3 tag  → :v1.2.3, :1.2.3, :1.2, :1, :latest
#   - PRs do NOT push (so forks can't backdoor an image)
#
# Auth uses OIDC + the workflow-scoped GITHUB_TOKEN with packages:write.
# No PAT required.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Don't waste minutes if multiple commits land on main quickly — only
# the latest needs to publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kinboard

jobs:
  # Decide whether this push actually needs an image build. Docs-/changelog-
  # only pushes to main don't change the image, so skip the ~10-20 min
  # multi-arch build for them. Tags and workflow_dispatch ALWAYS build — we
  # gate via an explicit job output rather than `paths-ignore`, because a
  # paths filter on a combined branches+tags trigger can wrongly skip tag
  # pushes (the release build).
  changes:
    name: Decide build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "tag / manual → build"; exit 0
          fi
          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "no base sha → build"; exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Changed files:"; echo "$changed"
          # Build unless EVERY changed file is docs/markdown.
          if echo "$changed" | grep -qvE '^(docs/|.*\.md$|LICENSE$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "code changed → build"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "docs-only → skip image build"
          fi

  build:
    name: Build + push (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            # Native arm64 runner — free for public repos since early 2025.
            # Replaces the prior QEMU-emulated arm64 build on ubuntu-latest,
            # which crash-looped on `next build` with SIGILL: V8's WASM
            # codegen emits instructions QEMU's x86→arm64 translator can't
            # handle (`qemu: uncaught target signal 4` →
            # `Next.js build worker exited with code: null and signal: SIGILL`).
            # Native is also ~3–5× faster (~10 min vs 30–60 min emulated).
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # No QEMU step: each matrix entry builds its own native platform.

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute platform-pair safe name
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Strict: only on main + tags, no per-PR tags.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build per-platform image (push as digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: webapp
          file: webapp/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Output one image per platform with no tags; the merge job
          # below stitches them together into a single multi-arch
          # manifest under the canonical tags from metadata-action.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Export digest for merge job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Re-extract metadata (same tags as build job)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Create + push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect resulting manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
