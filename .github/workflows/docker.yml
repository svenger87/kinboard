name: Docker image

# Builds + pushes the webapp image to GitHub Container Registry on every
# push to main and on tagged releases. Multi-arch (amd64 + arm64) so
# self-hosters on Raspberry Pi-class hardware can `docker pull` instead
# of building locally.
#
# Image: ghcr.io/svenger87/kinboard
# Also: ghcr.io/svenger87/kinboard-updater (the `updater` job), compose.yml's
# automatic updater (RFC-023 §4.11.3), with the same tags.
# And: ghcr.io/svenger87/kinboard-postgres (the `postgres-*` jobs), stock
# PostgreSQL 17 plus pg-safeupdate, the database of new installs on stock
# PostgreSQL (RFC-024 §4.2.1), built from webapp/image/postgres/.
# And: ghcr.io/svenger87/kinboard-aio (the `aio-*` jobs), the all-in-one
# image (RFC-024 §4.2, phase 5): built FROM each platform's webapp image by
# digest, so both shapes are one build, plus PostgreSQL, PostgREST and s6.
# Not on `latest` yet (AIO_IMAGE_TAGS).
#
# Every name the image is published under and every label and annotation it
# carries come from the `env` block below, read by both jobs (RFC-024 §4.5,
# §6). Each platform image is built with a provenance attestation (mode=max)
# and an SBOM; the merge job stitches them into one manifest list, annotates
# that list too, and checks all three are there (scripts/ci/check-image-metadata.sh).
#
# Tag scheme:
#   - main branch → :main, :sha-<short>          (no :latest -- see below)
#   - v1.2.3 tag  → :v1.2.3, :1.2.3, :1.2, :1, :latest
#   - PRs do NOT push (so forks can't backdoor an image)
#
# Auth uses OIDC + the workflow-scoped GITHUB_TOKEN with packages:write.
# No PAT required.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Don't waste minutes if multiple commits land on main quickly — only
# the latest needs to publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kinboard
  # kinboard-updater (RFC-023 §4.11.3): webapp/docker/Dockerfile.webhook,
  # published for compose.yml's `autoupdate` profile. Named here and nowhere
  # else, like IMAGE_NAME; the release's compose.yml takes it from here.
  UPDATER_IMAGE_NAME: ${{ github.repository_owner }}/kinboard-updater
  # The database image of new installs on stock PostgreSQL (RFC-024 §4.2.1).
  # Named here and nowhere else; the store listings take it from here (§4.5).
  POSTGRES_IMAGE_NAME: ${{ github.repository_owner }}/kinboard-postgres
  # The all-in-one image (RFC-024 §4.2, §11.3). Named here and nowhere else;
  # the Unraid template takes it from here (§4.5, §7).
  AIO_IMAGE_NAME: ${{ github.repository_owner }}/kinboard-aio
  # OCI labels on each platform image and annotations on the image and on the
  # manifest list. metadata-action adds description (the repository's),
  # source, version, revision and created itself; these override or add.
  # `licenses` is not here: each job reads it from webapp/package.json's
  # "license" (the "Image metadata" step), so a licence change is one edit.
  # GitHub reports the repository's license as "other", which metadata-action
  # would otherwise turn into NOASSERTION.
  IMAGE_METADATA: |
    org.opencontainers.image.title=Kinboard
    org.opencontainers.image.url=https://kinboard.app
    org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/wiki
    org.opencontainers.image.vendor=${{ github.repository_owner }}
  # The same for kinboard-updater, with its own title and description.
  UPDATER_METADATA: |
    org.opencontainers.image.title=Kinboard updater
    org.opencontainers.image.description=Automatic updates for a Kinboard install that runs compose.yml (the autoupdate profile)
    org.opencontainers.image.url=https://kinboard.app
    org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/wiki/Compose-UIs
    org.opencontainers.image.vendor=${{ github.repository_owner }}
  # The tags, for every job. `latest` means "newest stable release", not
  # "newest commit on main". It used to be attached to every main push, so a
  # release-candidate version bump -- an ordinary push to main -- moved it:
  # after v1.7.0 shipped, `latest` pointed at 1.7.1-rc.1 and every self-hoster
  # on the stable channel was pulling a release candidate. It now comes only
  # from a stable version tag; metadata-action's semver handling already
  # excludes prereleases, and omits the {{major}} / {{major}}.{{minor}}
  # aliases for them, so v1.7.1-rc.1 cannot claim `latest`, `1` or `1.7`.
  #
  # `next` is the pre-release channel: any semver tag carrying a prerelease
  # identifier (v1.6.0-rc.1, v1.6.0-beta.2) also publishes it, so testers pin
  # KINBOARD_TAG=next once and keep receiving release candidates.
  IMAGE_TAGS: |
    type=ref,event=branch
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=semver,pattern={{major}}
    type=sha,prefix=sha-,format=short
    type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
    type=raw,value=next,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}

  # kinboard-postgres: its own title and description; the rest as above.
  POSTGRES_IMAGE_METADATA: |
    org.opencontainers.image.title=Kinboard PostgreSQL
    org.opencontainers.image.description=PostgreSQL 17 (postgres:17-alpine) with pg-safeupdate, for new Kinboard installs on stock PostgreSQL
    org.opencontainers.image.url=https://kinboard.app
    org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/wiki
    org.opencontainers.image.vendor=${{ github.repository_owner }}
  # Its tags carry the PostgreSQL major first, so a later major is a new tag
  # and never moves an install's data folder: `17` follows stable releases
  # only (what a store listing pins), `17-next` release candidates, `17-main`
  # and `17-sha-<short>` every build of main.
  POSTGRES_IMAGE_TAGS: |
    type=raw,value=17-main,enable=${{ github.ref == 'refs/heads/main' }}
    type=sha,prefix=17-sha-,format=short
    type=semver,pattern={{version}},prefix=17-
    type=raw,value=17,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
    type=raw,value=17-next,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}

  # kinboard-aio: its own title and description; the rest as above.
  AIO_IMAGE_METADATA: |
    org.opencontainers.image.title=Kinboard (all-in-one)
    org.opencontainers.image.description=Kinboard in one container with one /data volume: the webapp, PostgreSQL 17 with pg-safeupdate, PostgREST and the scheduler, supervised by s6-overlay
    org.opencontainers.image.url=https://kinboard.app
    org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/wiki/All-in-one
    org.opencontainers.image.vendor=${{ github.repository_owner }}
  # The same version and channel tags as the webapp (RFC-024 §4.5), except
  # the stable channel: `next` (release candidates), `main`, `sha-<short>` and
  # each version tag, but no `latest`, `X` or `X.Y` until two release cycles
  # on `next`, the Raspberry Pi measurements and a rehearsed PostgreSQL major
  # upgrade on a copy of real data (RFC-024 §9, phase 5). Adding them is the
  # change that makes the image stable; the Unraid template follows it.
  AIO_IMAGE_TAGS: |
    type=ref,event=branch
    type=semver,pattern={{version}}
    type=sha,prefix=sha-,format=short
    type=raw,value=next,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}

jobs:
  # Decide whether this push actually needs an image build. Docs-/changelog-
  # only pushes to main don't change the image, so skip the ~10-20 min
  # multi-arch build for them. Tags and workflow_dispatch ALWAYS build — we
  # gate via an explicit job output rather than `paths-ignore`, because a
  # paths filter on a combined branches+tags trigger can wrongly skip tag
  # pushes (the release build).
  changes:
    name: Decide build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "tag / manual → build"; exit 0
          fi
          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "no base sha → build"; exit 0
          fi
          # A force-push (e.g. a history rewrite) leaves github.event.before
          # pointing at a commit that no longer exists, so the diff below would
          # abort with "bad object". Treat a missing base as "can't tell" and build.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "base sha gone (force-push) → build"; exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Changed files:"; echo "$changed"
          # Build unless EVERY changed file is docs/markdown.
          if echo "$changed" | grep -qvE '^(docs/|.*\.md$|LICENSE$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "code changed → build"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "docs-only → skip image build"
          fi

  build:
    name: Build + push (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            # Native arm64 runner — free for public repos since early 2025.
            # Replaces the prior QEMU-emulated arm64 build on ubuntu-latest,
            # which crash-looped on `next build` with SIGILL: V8's WASM
            # codegen emits instructions QEMU's x86→arm64 translator can't
            # handle (`qemu: uncaught target signal 4` →
            # `Next.js build worker exited with code: null and signal: SIGILL`).
            # Native is also ~3–5× faster (~10 min vs 30–60 min emulated).
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # No QEMU step: each matrix entry builds its own native platform.

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute platform-pair safe name
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      # The short sha goes into sw.js (webapp/scripts/stamp-sw.sh), so every image
      # serves a different service worker and open pages notice the deploy.
      # Same value on both platforms, and the same 7 characters as :sha-<short>.
      - name: Compute build revision
        id: rev
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # IMAGE_METADATA plus the licence, read from the source: the SPDX id
      # in webapp/package.json (e2e/licence-files.spec.ts pins it to LICENSE).
      - name: Image metadata
        id: oci
        run: |
          spdx="$(jq -er '.license | select(type == "string" and . != "")' webapp/package.json)"
          {
            echo "metadata<<OCI_METADATA_EOF"
            printf '%s\n' "$IMAGE_METADATA" | sed '/^[[:space:]]*$/d'
            echo "org.opencontainers.image.licenses=$spdx"
            echo "OCI_METADATA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (labels + annotations)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          # Tags come from the list above and nowhere else: metadata-action's
          # default (latest=auto) would add `latest` to every stable semver tag by
          # itself, for an image whose list has its own stable tag (or none).
          flavor: latest=false
          labels: ${{ steps.oci.outputs.metadata }}
          annotations: ${{ steps.oci.outputs.metadata }}

      - name: Build per-platform image (push as digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: webapp
          file: webapp/image/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Stated, not left to the action's defaults, so a change of default
          # can't quietly lower them: provenance in max mode (the build's
          # config and materials) and an SPDX SBOM, one attestation each per
          # platform. They survive the digest merge below.
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_REVISION=${{ steps.rev.outputs.short }}
          # Output one image per platform with no tags; the merge job
          # below stitches them together into a single multi-arch
          # manifest under the canonical tags from metadata-action.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Export digest for merge job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      # IMAGE_METADATA plus the licence, read from the source: the SPDX id
      # in webapp/package.json (e2e/licence-files.spec.ts pins it to LICENSE).
      - name: Image metadata
        id: oci
        run: |
          spdx="$(jq -er '.license | select(type == "string" and . != "")' webapp/package.json)"
          {
            echo "metadata<<OCI_METADATA_EOF"
            printf '%s\n' "$IMAGE_METADATA" | sed '/^[[:space:]]*$/d'
            echo "org.opencontainers.image.licenses=$spdx"
            echo "OCI_METADATA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Re-extract metadata (same tags as build job)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          # Tags come from the list above and nowhere else: metadata-action's
          # default (latest=auto) would add `latest` to every stable semver tag by
          # itself, for an image whose list has its own stable tag (or none).
          flavor: latest=false
          labels: ${{ steps.oci.outputs.metadata }}
          annotations: ${{ steps.oci.outputs.metadata }}

      # The manifest list gets the same annotations as the images, so a
      # registry that reads the index (GHCR's package page among them) shows
      # them. Arrays, not word-split strings: the description has spaces.
      - name: Create + push manifest list
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$REGISTRY/$IMAGE_NAME@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect resulting manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Check annotations, SBOM and provenance
        run: |
          scripts/ci/check-image-metadata.sh \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            <<< "$IMAGE_METADATA"
        # It reads the expected licence from webapp/package.json itself.

  # kinboard-updater (RFC-023 §4.11.3): a small Alpine image, so one job
  # builds both platforms (arm64 under QEMU: apk and curl only, no Node
  # build). The same tags, labels, provenance, SBOM and metadata check as the
  # webapp. Git installs keep building it locally as kinboard-webhook:local
  # (docker-compose.diun.yml); this does not touch that.
  updater:
    name: Build + push kinboard-updater
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # UPDATER_METADATA plus the licence from webapp/package.json, as the
      # webapp's "Image metadata" step.
      - name: Image metadata
        id: oci
        run: |
          spdx="$(jq -er '.license | select(type == "string" and . != "")' webapp/package.json)"
          {
            echo "metadata<<OCI_METADATA_EOF"
            printf '%s\n' "$UPDATER_METADATA" | sed '/^[[:space:]]*$/d'
            echo "org.opencontainers.image.licenses=$spdx"
            echo "OCI_METADATA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (labels + annotations)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.UPDATER_IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          # Tags come from the list above and nowhere else: metadata-action's
          # default (latest=auto) would add `latest` to every stable semver tag by
          # itself, for an image whose list has its own stable tag (or none).
          flavor: latest=false
          labels: ${{ steps.oci.outputs.metadata }}
          annotations: ${{ steps.oci.outputs.metadata }}

      - name: Build + push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: webapp/docker
          file: webapp/docker/Dockerfile.webhook
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max

      - name: Check annotations, SBOM and provenance
        run: |
          scripts/ci/check-image-metadata.sh \
            "${{ env.REGISTRY }}/${{ env.UPDATER_IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            <<< "$UPDATER_METADATA"

  # kinboard-postgres, the same way as the webapp: one native build per
  # platform pushed by digest, then one manifest list with the annotations,
  # provenance (max) and SBOM checked by the same script. Small: one C file
  # compiled against the pinned postgres:17-alpine.
  postgres-build:
    name: kinboard-postgres (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute platform-pair safe name
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      # PostgreSQL's licence and pg-safeupdate's, then Kinboard's for the two
      # scripts of its own the image carries.
      - name: Image metadata
        id: oci
        run: |
          spdx="$(jq -er '.license | select(type == "string" and . != "")' webapp/package.json)"
          {
            echo "metadata<<OCI_METADATA_EOF"
            printf '%s\n' "$POSTGRES_IMAGE_METADATA" | sed '/^[[:space:]]*$/d'
            echo "org.opencontainers.image.licenses=PostgreSQL AND ISC AND $spdx"
            echo "OCI_METADATA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (labels + annotations)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.POSTGRES_IMAGE_NAME }}
          tags: ${{ env.POSTGRES_IMAGE_TAGS }}
          # Tags come from the list above and nowhere else: metadata-action's
          # default (latest=auto) would add `latest` to every stable semver tag by
          # itself, for an image whose list has its own stable tag (or none).
          flavor: latest=false
          labels: ${{ steps.oci.outputs.metadata }}
          annotations: ${{ steps.oci.outputs.metadata }}

      - name: Build per-platform image (push as digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: webapp/image/postgres
          file: webapp/image/postgres/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.POSTGRES_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=postgres-${{ matrix.platform }}
          cache-to: type=gha,scope=postgres-${{ matrix.platform }},mode=max

      - name: Export digest for merge job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: postgres-digest-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  postgres-merge:
    name: Merge kinboard-postgres manifest
    runs-on: ubuntu-latest
    needs: [changes, postgres-build]
    if: needs.changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: postgres-digest-*
          merge-multiple: true

      - name: Image metadata
        id: oci
        run: |
          spdx="$(jq -er '.license | select(type == "string" and . != "")' webapp/package.json)"
          {
            echo "license=PostgreSQL AND ISC AND $spdx"
            echo "metadata<<OCI_METADATA_EOF"
            printf '%s\n' "$POSTGRES_IMAGE_METADATA" | sed '/^[[:space:]]*$/d'
            echo "org.opencontainers.image.licenses=PostgreSQL AND ISC AND $spdx"
            echo "OCI_METADATA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Re-extract metadata (same tags as build job)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.POSTGRES_IMAGE_NAME }}
          tags: ${{ env.POSTGRES_IMAGE_TAGS }}
          # Tags come from the list above and nowhere else: metadata-action's
          # default (latest=auto) would add `latest` to every stable semver tag by
          # itself, for an image whose list has its own stable tag (or none).
          flavor: latest=false
          labels: ${{ steps.oci.outputs.metadata }}
          annotations: ${{ steps.oci.outputs.metadata }}

      - name: Create + push manifest list
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$REGISTRY/$POSTGRES_IMAGE_NAME@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Check annotations, SBOM and provenance
        env:
          EXPECTED_LICENSE: ${{ steps.oci.outputs.license }}
        run: |
          scripts/ci/check-image-metadata.sh \
            "${{ env.REGISTRY }}/${{ env.POSTGRES_IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            <<< "$POSTGRES_IMAGE_METADATA"

  # kinboard-aio, per platform: FROM that platform's webapp image, by the
  # digest the build job pushed, so the all-in-one image carries exactly the
  # webapp just built (RFC-024 §2, §4.5). Then one manifest list, annotated,
  # with provenance (max) and an SBOM, checked by the same script.
  aio-build:
    name: kinboard-aio (${{ matrix.platform }})
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute platform-pair safe name
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      # The webapp image this platform's build job pushed, by digest.
      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ steps.platform.outputs.pair }}
          path: /tmp/webapp-digest

      - name: Webapp image and build revision
        id: app
        run: |
          digests=(/tmp/webapp-digest/*)
          [ "${#digests[@]}" = 1 ] || { echo "expected one webapp digest, got ${#digests[@]}"; exit 1; }
          echo "image=$REGISTRY/$IMAGE_NAME@sha256:$(basename "${digests[0]}")" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The webapp's licence and the others the image carries: PostgreSQL,
      # pg-safeupdate (ISC), PostgREST (MIT), s6-overlay and skarnet's s6 (ISC).
      - name: Image metadata
        id: oci
        run: |
          spdx="$(jq -er '.license | select(type == "string" and . != "")' webapp/package.json)"
          {
            echo "metadata<<OCI_METADATA_EOF"
            printf '%s\n' "$AIO_IMAGE_METADATA" | sed '/^[[:space:]]*$/d'
            echo "org.opencontainers.image.licenses=$spdx AND PostgreSQL AND MIT AND ISC"
            echo "OCI_METADATA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (labels + annotations)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.AIO_IMAGE_NAME }}
          tags: ${{ env.AIO_IMAGE_TAGS }}
          # metadata-action's default (latest=auto) adds `latest` to every
          # stable semver tag by itself, whatever AIO_IMAGE_TAGS says: off
          # until phase 5's gates are met (see AIO_IMAGE_TAGS).
          flavor: latest=false
          labels: ${{ steps.oci.outputs.metadata }}
          annotations: ${{ steps.oci.outputs.metadata }}

      - name: Build per-platform image (push as digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: webapp/image/aio
          file: webapp/image/aio/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          build-args: |
            APP_IMAGE=${{ steps.app.outputs.image }}
            BUILD_REVISION=${{ steps.app.outputs.short }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.AIO_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=aio-${{ matrix.platform }}
          cache-to: type=gha,scope=aio-${{ matrix.platform }},mode=max

      - name: Export digest for merge job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: aio-digest-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  aio-merge:
    name: Merge kinboard-aio manifest
    runs-on: ubuntu-latest
    needs: [changes, aio-build]
    if: needs.changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: aio-digest-*
          merge-multiple: true

      - name: Image metadata
        id: oci
        run: |
          spdx="$(jq -er '.license | select(type == "string" and . != "")' webapp/package.json)"
          {
            echo "license=$spdx AND PostgreSQL AND MIT AND ISC"
            echo "metadata<<OCI_METADATA_EOF"
            printf '%s\n' "$AIO_IMAGE_METADATA" | sed '/^[[:space:]]*$/d'
            echo "org.opencontainers.image.licenses=$spdx AND PostgreSQL AND MIT AND ISC"
            echo "OCI_METADATA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Re-extract metadata (same tags as build job)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.AIO_IMAGE_NAME }}
          tags: ${{ env.AIO_IMAGE_TAGS }}
          # metadata-action's default (latest=auto) adds `latest` to every
          # stable semver tag by itself, whatever AIO_IMAGE_TAGS says: off
          # until phase 5's gates are met (see AIO_IMAGE_TAGS).
          flavor: latest=false
          labels: ${{ steps.oci.outputs.metadata }}
          annotations: ${{ steps.oci.outputs.metadata }}

      - name: Create + push manifest list
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$REGISTRY/$AIO_IMAGE_NAME@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      # The arm64 SBOM lists the glibc runtime that image's PostgREST brings
      # along (webapp/image/aio/Dockerfile), with versions and licences; the
      # amd64 one, whose PostgREST is static, has no glibc.
      - name: Check annotations, SBOM and provenance
        env:
          EXPECTED_LICENSE: ${{ steps.oci.outputs.license }}
          SBOM_EXPECT: linux/arm64=libc6 linux/arm64=libpq5 linux/amd64=!libc6
        run: |
          scripts/ci/check-image-metadata.sh \
            "${{ env.REGISTRY }}/${{ env.AIO_IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            <<< "$AIO_IMAGE_METADATA"

  # The GitHub release for every version tag (RFC-024 §6), by
  # scripts/publish-release.sh: a release candidate is published as a
  # pre-release with its CHANGELOG.md notes; a stable release is published
  # with docs/release-notes/vX.Y.Z.md when that exists, and otherwise created
  # as a draft with its changelog section, to be edited by hand. A release
  # that already exists, draft or not, is never touched.
  #
  # Every new release carries compose.yml as an asset (RFC-023 §4.6): the
  # tagged file with this workflow's REGISTRY/IMAGE_NAME (and
  # UPDATER_IMAGE_NAME for the updater) as the images and the
  # release's channel (latest or next) as the default tag
  # (scripts/release-compose.mjs). The script reads both from the env above.
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    # The updater too: the release's compose.yml names its image.
    needs: [changes, merge, updater]
    if: >-
      needs.changes.outputs.build == 'true' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release from tag
        run: scripts/publish-release.sh "${{ github.ref_name }}"
