name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions for the GITHUB_TOKEN — none of these jobs write
# back to the repo, push images, or comment on PRs. Read-only on the
# checkout is all that's needed.
permissions:
  contents: read

# Cancel in-progress runs on the same ref to save CI time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  i18n-validate:
    name: i18n bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('webapp/messages/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('webapp/messages/de.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('webapp/messages/fr.json','utf8'))"

      - name: Compare key parity (en ↔ de, fr)
        run: |
          node -e '
            const en = require("./webapp/messages/en.json");
            const flatten = (obj, prefix = "") => Object.entries(obj).flatMap(([k, v]) =>
              v && typeof v === "object" && !Array.isArray(v)
                ? flatten(v, prefix + k + ".")
                : [prefix + k]
            );
            const enKeys = new Set(flatten(en));
            let failed = false;
            for (const loc of ["de", "fr"]) {
              const locKeys = new Set(flatten(require("./webapp/messages/" + loc + ".json")));
              const missingInLoc = [...enKeys].filter(k => !locKeys.has(k));
              const extraInLoc = [...locKeys].filter(k => !enKeys.has(k));
              if (missingInLoc.length || extraInLoc.length) {
                failed = true;
                if (missingInLoc.length) console.log("Missing in " + loc + ".json:\n" + missingInLoc.map(k => "  " + k).join("\n"));
                if (extraInLoc.length) console.log("Extra in " + loc + ".json (not in en):\n" + extraInLoc.map(k => "  " + k).join("\n"));
              } else {
                console.log("en/" + loc + " parity OK (" + enKeys.size + " keys)");
              }
            }
            if (failed) process.exit(1);
          '

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on shipped scripts
        run: |
          for f in setup.sh webapp/deploy.sh webapp/docker/start.sh; do
            echo "checking $f"
            bash -n "$f"
          done

  migrations:
    name: Migration order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check migration apply order
        run: node webapp/docker/check-migration-order.mjs

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    # PR-only: needs a base..head diff. Skipped when the PR carries the
    # `skip-changelog` label (CI/lockfile/refactor changes with no
    # user-visible behavior — see CONTRIBUTING.md).
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG entry for user-facing changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^webapp/src/'; then
            if ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "::error::This PR changes webapp/src/** but does not update CHANGELOG.md."
              echo "Add an entry under [Unreleased], or apply the 'skip-changelog' label if this change isn't user-visible."
              exit 1
            fi
          fi
          echo "Changelog check passed."
