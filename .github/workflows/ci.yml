name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions for the GITHUB_TOKEN — none of these jobs write
# back to the repo, push images, or comment on PRs. Read-only on the
# checkout is all that's needed.
permissions:
  contents: read

# Cancel in-progress runs on the same ref to save CI time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      # npm 10 (bundled with Node 20) and npm 11 disagree on lockfile
      # shape, and `npm ci` on the wrong one fails outright. Corepack
      # reads `packageManager` from webapp/package.json so the version
      # is pinned in exactly one place. Plain `corepack enable` does
      # NOT shim npm — the explicit `npm` argument is required.
      - name: Use the pinned npm
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      # npm 10 (bundled with Node 20) and npm 11 disagree on lockfile
      # shape, and `npm ci` on the wrong one fails outright. Corepack
      # reads `packageManager` from webapp/package.json so the version
      # is pinned in exactly one place. Plain `corepack enable` does
      # NOT shim npm — the explicit `npm` argument is required.
      - name: Use the pinned npm
        run: corepack enable npm

      - name: Install dependencies
        run: npm ci

      # The ESLint config disables no-explicit-any / no-unused-vars, so type
      # regressions otherwise only surface in the Docker `next build`. This
      # catches them on every PR without the cost of a full production build.
      - name: Run tsc --noEmit
        run: npx tsc --noEmit

  i18n-validate:
    name: i18n bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm 10 (bundled with Node 20) and npm 11 disagree on lockfile
      # shape, and `npm ci` on the wrong one fails outright. Corepack
      # reads `packageManager` from webapp/package.json so the version
      # is pinned in exactly one place. Plain `corepack enable` does
      # NOT shim npm — the explicit `npm` argument is required.
      - name: Use the pinned npm
        run: corepack enable npm

      - name: Validate JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('webapp/messages/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('webapp/messages/de.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('webapp/messages/fr.json','utf8'))"

      # en is the source of truth. STRICT locales (the maintained core) must be
      # in full parity. Other locales may ship partial coverage — untranslated
      # keys fall back to English at runtime (see src/i18n/request.ts) — so a
      # missing key is reported as coverage, not a failure. A key present in a
      # locale but absent from en is always an error (typo/stale; it can't fall
      # back).
      - name: Compare key parity (en ↔ locales)
        run: |
          node -e '
            const STRICT = ["de"];
            const en = require("./webapp/messages/en.json");
            const flatten = (obj, prefix = "") => Object.entries(obj).flatMap(([k, v]) =>
              v && typeof v === "object" && !Array.isArray(v)
                ? flatten(v, prefix + k + ".")
                : [prefix + k]
            );
            const enKeys = new Set(flatten(en));
            let failed = false;
            for (const loc of ["de", "fr", "zh"]) {
              const locKeys = new Set(flatten(require("./webapp/messages/" + loc + ".json")));
              const missing = [...enKeys].filter(k => !locKeys.has(k));
              const extra = [...locKeys].filter(k => !enKeys.has(k));
              if (extra.length) {
                failed = true;
                console.log("Extra keys in " + loc + ".json (not in en — typo/stale, cannot fall back):\n" + extra.map(k => "  " + k).join("\n"));
              }
              if (missing.length && STRICT.includes(loc)) {
                failed = true;
                console.log("Missing in " + loc + ".json (strict locale, must be complete):\n" + missing.map(k => "  " + k).join("\n"));
              } else if (missing.length) {
                const pct = (((enKeys.size - missing.length) / enKeys.size) * 100).toFixed(1);
                console.log(loc + ".json: " + pct + "% translated (" + missing.length + " keys fall back to English) — OK, community locale");
              } else if (!extra.length) {
                console.log("en/" + loc + " parity OK (" + enKeys.size + " keys)");
              }
            }
            if (failed) process.exit(1);
          '

      - name: Check for empty translation values
        run: |
          node -e '
            const check = (file) => {
              const obj = require(file);
              const empties = [];
              const walk = (o, prefix = "") => Object.entries(o).forEach(([k, v]) => {
                if (v && typeof v === "object" && !Array.isArray(v)) walk(v, prefix + k + ".");
                else if (typeof v === "string" && v.trim() === "") empties.push(prefix + k);
              });
              walk(obj);
              return empties;
            };
            const bad = [
              ...check("./webapp/messages/en.json").map(k => "en: " + k),
              ...check("./webapp/messages/de.json").map(k => "de: " + k),
              ...check("./webapp/messages/fr.json").map(k => "fr: " + k),
            ];
            if (bad.length) {
              console.log("Empty translation values:\n" + bad.map(k => "  " + k).join("\n"));
              process.exit(1);
            }
            console.log("No empty translation values.");
          '

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on shipped scripts
        run: |
          for f in install.sh setup.sh webapp/deploy.sh webapp/docker/start.sh webapp/docker/test-upgrade.sh; do
            echo "checking $f"
            bash -n "$f"
          done
          # Developer rigs and CI checks (rigs.yml and docker.yml run them; here they only have to parse).
          for f in scripts/rigs/*.sh scripts/rigs/stock-postgres/*.sh scripts/stores/*.sh scripts/ci/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done
          # POSIX sh: these run inside the Alpine webhook container.
          # kinboard-db-init and kinboard-postgres's guard run in Alpine images too.
          for f in webapp/docker/kinboard-self-update.sh webapp/docker/kinboard-entry.sh webapp/docker/migrate.sh webapp/docker/webapp-entrypoint.sh \
                   webapp/docker/kinboard-db-init.sh webapp/docker/postgres/kinboard-postgres-guard.sh webapp/docker/postgres/00-kinboard-marker.sh \
                   webapp/docker/kinboard-backup.sh webapp/docker/storage-api-move.sh webapp/docker/aio/rootfs/usr/local/lib/kinboard-aio/*.sh; do
            echo "checking $f"
            sh -n "$f"
          done

  migrations:
    name: Migration order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm 10 (bundled with Node 20) and npm 11 disagree on lockfile
      # shape, and `npm ci` on the wrong one fails outright. Corepack
      # reads `packageManager` from webapp/package.json so the version
      # is pinned in exactly one place. Plain `corepack enable` does
      # NOT shim npm — the explicit `npm` argument is required.
      - name: Use the pinned npm
        run: corepack enable npm
      - name: Check migration apply order
        run: node scripts/ci/check-migration-order.mjs
      # An update that doesn't come up falls back to the previous image on
      # the schema the new one already migrated (RFC-023 §4.11.4); that only
      # works while migrations are additive. Exceptions are reviewed in
      # scripts/ci/migrations-not-additive.json. The same script refuses a
      # new migration that adds tables to a publication (RFC-024 §4.6 step 5):
      # live updates come from the kinboard_change_feed trigger since 1.15.
      - name: Check migrations are additive and add nothing to a publication
        run: node scripts/ci/check-additive-migrations.mjs

  # RFC-024 §4.6 step 4: src/types/database.generated.ts is what the
  # migrations build, never a hand edit. This starts a throwaway PostgreSQL
  # (kinboard-postgres's pinned base image), applies the role bootstrap,
  # init.sql and every migration as a new install does, regenerates the file
  # and fails, with the diff, when the committed one differs. A migration
  # merged without `npm run db:generate` fails here.
  db-types:
    name: Database types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - name: Use the pinned npm
        run: corepack enable npm
      - name: Install dependencies
        run: npm ci
      - name: Generated types match the migrated schema
        run: npm run db:check

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    # PR-only: needs a base..head diff. Skipped when the PR carries the
    # `skip-changelog` label (CI/lockfile/refactor changes with no
    # user-visible behavior — see CONTRIBUTING.md).
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG entry for user-facing changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^webapp/src/'; then
            if ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "::error::This PR changes webapp/src/** but does not update CHANGELOG.md."
              echo "Add an entry under [Unreleased], or apply the 'skip-changelog' label if this change isn't user-visible."
              exit 1
            fi
          fi
          echo "Changelog check passed."

  changelog-format:
    name: Changelog format
    runs-on: ubuntu-latest
    # Not PR-only: unlike the job above this needs no base..head diff, and a
    # repeated heading can also arrive on main through a direct push (a
    # release bump, a hand-edit). Checking both is what keeps it from
    # drifting back.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No `npm ci` and no corepack: the script imports only node:fs/url/path,
      # so it runs against a bare checkout.
      - name: Check CHANGELOG section structure
        run: node scripts/check-changelog-sections.mjs

  specs:
    name: Specs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    # 40 of the 43 spec files never touch a browser or a running stack — they
    # assert on pure functions and on the source itself. They were written,
    # reviewed and merged, and then only ever ran if somebody ran them by hand:
    # e2e.yml executes two files, and every security spec written for the
    # pentest (rest-gate, rate-limit, security-headers, family-scope) sat
    # dormant. They belong here, where they gate a PR in seconds, rather than
    # behind the E2E job's Docker boot.
    #
    # Deliberately no Playwright browser install: `playwright test` is being
    # used as a plain test runner. Adding one would put a 200MB download on the
    # critical path of every PR for tests that never open a page.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      # See the migrations job: corepack reads the pinned npm from
      # webapp/package.json so the lockfile shape always matches.
      - name: Use the pinned npm
        run: corepack enable npm
      - name: Install dependencies
        run: npm ci

      # The six that need a running instance, and why — kept as an explicit
      # list because it has to be read, not inferred:
      #   smoke, secrets, setup  - take Playwright's page/request fixture
      #   restore                - drives /api/export and /api/import over HTTP.
      #                            Its test.skip() guard runs *after* the first
      #                            request, so with no server it fails rather
      #                            than skipping.
      #   health-endpoint        - asserts what /api/health reports about the
      #                            database, realtime and the worker, which
      #                            only means anything against a live stack.
      #   visual-audit           - a manual screenshot tool that throws at
      #                            import unless FAMILY_CODE is set
      # e2e.yml boots the stack and covers those. Everything else is pure
      # functions and source assertions, and runs here in seconds.
      #
      # No --project on purpose: that is all four. The specs that never open a
      # browser run once, in `unit`; desktop, mobile and webkit get the ones
      # that do, which skip here without a stack (e2e/spec-projects.ts).
      - name: Run the stack-free specs
        run: npx playwright test $(ls e2e/*.spec.ts | grep -vE '/(smoke|secrets|setup|restore|health-endpoint|visual-audit)\.spec\.ts$' | tr '\n' ' ')
      # Built-in holidays are local calendar days (RFC-014 §4.6). The runner is
      # UTC, where a day read through an instant cannot slip; west and far east
      # of it, it would. One project is enough: these are pure functions.
      - name: Holiday dates hold west and east of UTC
        run: |
          for tz in America/Los_Angeles Pacific/Auckland; do
            TZ=$tz npx playwright test e2e/holiday-sources.spec.ts e2e/holiday-countdown.spec.ts --project=unit || exit 1
          done

  build:
    name: Production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    # `tsc --noEmit` cannot see what `next build` sees: "use client" boundary
    # violations, invalid route segment config, server-only imports pulled into
    # a client component, prerender-time failures. Without this a PR can merge
    # green and break the image build on main, where it is found later and by
    # somebody else.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - name: Use the pinned npm
        run: corepack enable npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        # No NEXT_PUBLIC_* values: nothing in the app reads one that a build
        # could bake in (RFC-024 §4.6 step 3), so the build needs none.
        run: npm run build

  # RFC-024 §6.5 and §7: every app-store listing is generated from one
  # metadata file (dist/<app>.yaml) with compose.yml and docker.yml, and
  # committed under dist/. The Specs job already fails when dist/ is not what
  # the generator writes (e2e/store-listings.spec.ts). This one puts each
  # listing through its store's own tooling, pinned in
  # scripts/stores/upstream.json: Umbrel's lint-apps.mjs with its image checks,
  # CasaOS's validate_compose.py and store build, TrueNAS's metadata generator
  # and renderer, Portainer's template schema. Only when something it guards
  # changed; it pulls TrueNAS's 3.8 GB validation image.
  store-listings-decide:
    name: Store listings (decide)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          guarded="dist/ scripts/stores/ compose.yml .github/workflows/docker.yml webapp/package.json .github/workflows/ci.yml"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "no usable base: run"; exit 0
          fi
          run=false
          while IFS= read -r f; do
            for p in $guarded; do case "$f" in "$p"*) run=true; echo "guarded: $f" ;; esac; done
          done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "run=$run" >> "$GITHUB_OUTPUT"

  store-listings:
    name: Store listings (each store's own tooling)
    needs: store-listings-decide
    if: needs.store-listings-decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      # js-yaml, which the generator reads the inputs with.
      - name: Install webapp deps
        working-directory: webapp
        run: |
          corepack enable npm
          npm ci
      - name: Generated listings up to date
        run: node scripts/stores/build-store-listings.mjs --check
      - name: Each store's own validation
        run: scripts/stores/validate-upstream.sh

  # RFC-024 §6.5: the gates for stock PostgreSQL, mandatory for any install on
  # kinboard-postgres (scripts/rigs/test-stock-postgres.sh): the policy, grant
  # and role comparison of supabase/postgres 15, stock 15 and stock 17;
  # filterless writes refused on all three; compose.yml on kinboard-postgres:17
  # with the row-level-security matrix and the 18 database specs; every
  # protection removed on purpose (red); the legacy install unchanged; the
  # guard; the documented move. About 25 minutes, every wait inside with its
  # own deadline. Only when something it guards changed; weekly regardless,
  # on both architectures (rigs.yml).
  # The all-in-one image (RFC-024 phase 5, §6.5): scripts/rigs/test-aio.sh
  # whenever the image, what it runs or the rig changes. amd64 here; arm64
  # weekly in rigs.yml.
  aio-decide:
    name: All-in-one image (decide)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          guarded="webapp/docker/aio/ webapp/docker/kinboard-transfer.mjs webapp/docker/kinboard-backup.sh
                   webapp/docker/webapp-entrypoint.sh webapp/docker/migrate.sh webapp/docker/kinboard-init.mjs
                   webapp/docker/kinboard-db-init.sh webapp/docker/stock-postgres-bootstrap.sql webapp/docker/init.sql
                   webapp/docker/migrations/ webapp/docker/Dockerfile scripts/rigs/test-aio.sh scripts/rigs/stock-postgres/
                   webapp/e2e/rls-matrix.spec.ts .github/workflows/ci.yml"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "no usable base: run"; exit 0
          fi
          run=false
          while IFS= read -r f; do
            for p in $guarded; do case "$f" in "$p"*) run=true; echo "guarded: $f" ;; esac; done
          done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "run=$run" >> "$GITHUB_OUTPUT"

  aio:
    name: All-in-one image
    needs: aio-decide
    if: needs.aio-decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      # Playwright only as a test runner (the rls-matrix spec opens no browser).
      - name: Install webapp deps
        working-directory: webapp
        run: |
          corepack enable npm
          npm ci
      - name: Run the rig
        env:
          KINBOARD_RIG: "1"
        run: scripts/rigs/test-aio.sh

  stock-postgres-decide:
    name: Stock PostgreSQL gates (decide)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          guarded="webapp/docker/ compose.yml scripts/rigs/test-stock-postgres.sh scripts/rigs/stock-postgres/
                   webapp/e2e/rls-matrix.spec.ts webapp/e2e/fixtures/rls-matrix-seed.sql webapp/e2e/whole-database.ts
                   .github/workflows/ci.yml"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "no usable base: run"; exit 0
          fi
          run=false
          while IFS= read -r f; do
            for p in $guarded; do case "$f" in "$p"*) run=true; echo "guarded: $f" ;; esac; done
          done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "run=$run" >> "$GITHUB_OUTPUT"

  stock-postgres:
    name: Stock PostgreSQL gates
    needs: stock-postgres-decide
    if: needs.stock-postgres-decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      # Playwright only as a test runner: the specs here open no browser.
      - name: Install webapp deps
        working-directory: webapp
        run: |
          corepack enable npm
          npm ci
      - name: Run the gates
        env:
          KINBOARD_RIG: "1"
        run: scripts/rigs/test-stock-postgres.sh
