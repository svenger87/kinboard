name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions for the GITHUB_TOKEN — none of these jobs write
# back to the repo, push images, or comment on PRs. Read-only on the
# checkout is all that's needed.
permissions:
  contents: read

# Cancel in-progress runs on the same ref to save CI time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The ESLint config disables no-explicit-any / no-unused-vars, so type
      # regressions otherwise only surface in the Docker `next build`. This
      # catches them on every PR without the cost of a full production build.
      - name: Run tsc --noEmit
        run: npx tsc --noEmit

  i18n-validate:
    name: i18n bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('webapp/messages/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('webapp/messages/de.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('webapp/messages/fr.json','utf8'))"

      # en is the source of truth. STRICT locales (the maintained core) must be
      # in full parity. Other locales may ship partial coverage — untranslated
      # keys fall back to English at runtime (see src/i18n/request.ts) — so a
      # missing key is reported as coverage, not a failure. A key present in a
      # locale but absent from en is always an error (typo/stale; it can't fall
      # back).
      - name: Compare key parity (en ↔ locales)
        run: |
          node -e '
            const STRICT = ["de"];
            const en = require("./webapp/messages/en.json");
            const flatten = (obj, prefix = "") => Object.entries(obj).flatMap(([k, v]) =>
              v && typeof v === "object" && !Array.isArray(v)
                ? flatten(v, prefix + k + ".")
                : [prefix + k]
            );
            const enKeys = new Set(flatten(en));
            let failed = false;
            for (const loc of ["de", "fr"]) {
              const locKeys = new Set(flatten(require("./webapp/messages/" + loc + ".json")));
              const missing = [...enKeys].filter(k => !locKeys.has(k));
              const extra = [...locKeys].filter(k => !enKeys.has(k));
              if (extra.length) {
                failed = true;
                console.log("Extra keys in " + loc + ".json (not in en — typo/stale, cannot fall back):\n" + extra.map(k => "  " + k).join("\n"));
              }
              if (missing.length && STRICT.includes(loc)) {
                failed = true;
                console.log("Missing in " + loc + ".json (strict locale, must be complete):\n" + missing.map(k => "  " + k).join("\n"));
              } else if (missing.length) {
                const pct = (((enKeys.size - missing.length) / enKeys.size) * 100).toFixed(1);
                console.log(loc + ".json: " + pct + "% translated (" + missing.length + " keys fall back to English) — OK, community locale");
              } else if (!extra.length) {
                console.log("en/" + loc + " parity OK (" + enKeys.size + " keys)");
              }
            }
            if (failed) process.exit(1);
          '

      - name: Check for empty translation values
        run: |
          node -e '
            const check = (file) => {
              const obj = require(file);
              const empties = [];
              const walk = (o, prefix = "") => Object.entries(o).forEach(([k, v]) => {
                if (v && typeof v === "object" && !Array.isArray(v)) walk(v, prefix + k + ".");
                else if (typeof v === "string" && v.trim() === "") empties.push(prefix + k);
              });
              walk(obj);
              return empties;
            };
            const bad = [
              ...check("./webapp/messages/en.json").map(k => "en: " + k),
              ...check("./webapp/messages/de.json").map(k => "de: " + k),
              ...check("./webapp/messages/fr.json").map(k => "fr: " + k),
            ];
            if (bad.length) {
              console.log("Empty translation values:\n" + bad.map(k => "  " + k).join("\n"));
              process.exit(1);
            }
            console.log("No empty translation values.");
          '

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on shipped scripts
        run: |
          for f in setup.sh webapp/deploy.sh webapp/docker/start.sh; do
            echo "checking $f"
            bash -n "$f"
          done

  migrations:
    name: Migration order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check migration apply order
        run: node webapp/docker/check-migration-order.mjs

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    # PR-only: needs a base..head diff. Skipped when the PR carries the
    # `skip-changelog` label (CI/lockfile/refactor changes with no
    # user-visible behavior — see CONTRIBUTING.md).
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG entry for user-facing changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^webapp/src/'; then
            if ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "::error::This PR changes webapp/src/** but does not update CHANGELOG.md."
              echo "Add an entry under [Unreleased], or apply the 'skip-changelog' label if this change isn't user-visible."
              exit 1
            fi
          fi
          echo "Changelog check passed."
