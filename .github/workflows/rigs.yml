name: Rigs

# The rigs that build an image and boot a whole stack.
#
# Deliberately NOT on push. Each one pulls the Supabase image set, builds the
# webapp, and brings up eleven containers — minutes per run, and the fresh
# install rig repeats that twenty times when asked to. Running them on every
# commit would make every commit slow, and the failures they catch are races
# and disaster-recovery paths, which do not appear and disappear commit to
# commit.
#
# So: weekly, and on demand. Weekly is chosen over nightly because the things
# these guard — a migration race, a backup that will not restore, an upgrade
# path from a two-versions-old release — are broken by *changes*, and a week is
# short enough to place the blame on a small range of them. Before cutting a
# release, run it by hand.

on:
  workflow_dispatch:
    inputs:
      rig:
        description: Which rig to run
        type: choice
        default: all
        options: [all, fresh-install, upgrade, rollback, backup-restore, integration-api, one-file, stock-postgres, stock-postgres-arm64, store-listings, aio, aio-arm64]
      iterations:
        description: Iterations for the repeating rigs (fresh install, backup/restore)
        type: string
        default: "3"
  schedule:
    # Mondays, 04:47 UTC. Off the hour on purpose: the hour and half-hour are
    # when every scheduled workflow on GitHub starts at once and queues.
    - cron: "47 4 * * 1"

# A second run of a heavy matrix while the first is still going gains nothing
# and competes for runners.
concurrency:
  group: rigs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The matrix is built here rather than filtered in the job below, because the
  # `matrix` context is not available to a job-level `if` — a condition there
  # comparing against matrix.rig silently never matches. Choosing the list up
  # front also means a dispatch for one rig starts one runner, not four that
  # immediately skip.
  select:
    runs-on: ubuntu-latest
    outputs:
      rigs: ${{ steps.pick.outputs.rigs }}
    steps:
      - id: pick
        run: |
          want="${{ github.event.inputs.rig || 'all' }}"
          if [ "$want" = "all" ]; then
            echo 'rigs=["fresh-install","upgrade","rollback","backup-restore","integration-api","one-file","stock-postgres","stock-postgres-arm64","store-listings","aio","aio-arm64"]' >> "$GITHUB_OUTPUT"
          else
            echo "rigs=[\"$want\"]" >> "$GITHUB_OUTPUT"
          fi

  rig:
    name: ${{ matrix.rig }}
    needs: select
    # The stock PostgreSQL gates also run on arm64 (RFC-024 §6.5): the
    # database image is built for both, and a Raspberry Pi is arm64.
    # So does the all-in-one image's rig (RFC-024 §6.5, phase 5).
    runs-on: ${{ (matrix.rig == 'stock-postgres-arm64' || matrix.rig == 'aio-arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # The fresh-install rig at 20 iterations is a little over an hour on this
    # hardware; the default of 3 is far under. Generous rather than tight,
    # because a rig killed by a timeout looks exactly like a rig that hung.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rig: ${{ fromJSON(needs.select.outputs.rigs) }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade rig checks out the release it upgrades *from* by its
          # tag. A default checkout is one commit with no tags, so from
          # 2026-10-19 until this the rig failed with "no tag v1.13.0 to check
          # out" before testing anything, and 1.13 -> 1.15 went out unrigged.
          fetch-depth: 0
          fetch-tags: true

      # A hosted runner ships with several gigabytes of Android SDK, .NET and
      # Haskell toolchains that nothing here uses. Booting the Supabase stack
      # plus a Next build needs the room more than they do.
      - name: Reclaim disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      # The stock PostgreSQL gates run Playwright specs against their stack.
      - uses: actions/setup-node@v4
        if: startsWith(matrix.rig, 'stock-postgres') || matrix.rig == 'store-listings' || startsWith(matrix.rig, 'aio')
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - name: Install webapp deps
        if: startsWith(matrix.rig, 'stock-postgres') || matrix.rig == 'store-listings' || startsWith(matrix.rig, 'aio')
        working-directory: webapp
        run: |
          corepack enable npm
          npm ci

      - name: Run ${{ matrix.rig }}
        env:
          # The rigs refuse to start without it: they live in scripts/rigs/,
          # away from start.sh, and say "this is not an updater" to anyone who
          # runs one without asking for a test (#539).
          KINBOARD_RIG: "1"
          # No /mnt/user on a runner. Everything the rigs write goes under the
          # runner's own temp directory, which is discarded with the VM.
          RIG_DATA: ${{ runner.temp }}/rig-${{ matrix.rig }}
          ITERATIONS: ${{ github.event.inputs.iterations || '3' }}
        run: |
          set -o pipefail
          case "${{ matrix.rig }}" in
            fresh-install)   scripts/rigs/test-fresh-install.sh "$ITERATIONS" ;;
            backup-restore)  scripts/rigs/test-backup-restore.sh "$ITERATIONS" ;;
            # Takes the versions to upgrade *from*; its own defaults are the
            # two most recent, which is what a real user is most likely on.
            upgrade)         scripts/rigs/test-upgrade.sh ;;
            # The newest stable release's published image on HEAD's migrated
            # schema: what an update falls back to when it doesn't come up
            # (RFC-023 §4.11.4). Tags come from the full checkout above.
            rollback)        scripts/rigs/test-upgrade.sh --rollback ;;
            integration-api) scripts/rigs/test-integration-api.sh ;;
            # compose.yml alone in an empty folder, no .env, no checkout: the
            # file every new install runs (RFC-023 §8.1 A1/A3), then an
            # upgrade onto this build from the previous published image.
            one-file)        scripts/rigs/test-one-file.sh ;;
            # RFC-024 §6.5, the gates ci.yml's stock-postgres job runs when
            # their files change, weekly regardless, on both architectures.
            stock-postgres|stock-postgres-arm64)
                             scripts/rigs/test-stock-postgres.sh ;;
            # RFC-024 §10 without the store systems: the compose each store
            # would run (CasaOS, Umbrel, Portainer as listed; TrueNAS as its
            # renderer renders it), started, with the rls-matrix spec.
            store-listings)  RIG_BUILD=1 scripts/rigs/test-store-listings.sh ;;
            # The all-in-one image (RFC-024 phase 5): a fresh start, the
            # §6.5 gates, PUID 99:100, export/import with compose.yml (amd64
            # only, as §6.5 lists it), the start guarantees and a rehearsed
            # PostgreSQL 17 -> 18 upgrade with its forced failures.
            aio)             scripts/rigs/test-aio.sh ;;
            aio-arm64)       RIG_PHASES="fresh gates puid migrate upgrade measure" scripts/rigs/test-aio.sh ;;
          esac

      # A rig that fails has already printed why, but the stack's own logs are
      # what say whether it was the app or the environment underneath it.
      - name: Stack logs on failure
        if: failure()
        working-directory: webapp/docker
        run: |
          for p in kbinstall kbupg kbbak; do
            if docker ps -a --filter "name=${p}-" --format '{{.Names}}' | grep -q .; then
              echo "===== $p ====="
              docker ps -a --filter "name=${p}-" --format '  {{.Names}}\t{{.Status}}'
              docker logs "${p}-webapp" 2>&1 | tail -80 || true
            fi
          done
          # The one-file rig runs compose.yml's own fixed names (kinboard-*).
          for c in kinboard-init kinboard-db-init kinboard-webapp; do
            if docker container inspect "$c" >/dev/null 2>&1; then
              echo "===== $c ====="
              docker logs "$c" 2>&1 | tail -80 || true
            fi
          done

      # The rig tears its stack down on any exit, failures and interrupts
      # included (an EXIT trap); this covers the one where it was killed
      # outright and the trap never ran. The runner is
      # thrown away regardless — this only keeps a failing job's own later
      # steps from tripping over a half-up stack.
      - name: Tear down
        if: always()
        working-directory: webapp/docker
        run: |
          for p in kbinstall kbupg kbbak; do
            docker compose -p "$p" down -v --remove-orphans >/dev/null 2>&1 || true
          done
          docker ps -a --format '{{.Names}}' | grep -E '^(kbinstall|kbupg|kbbak)-' \
            | xargs -r docker rm -f >/dev/null 2>&1 || true
          # The one-file rig: compose.yml's fixed names. A runner has no real
          # install, so these are the rig's.
          docker rm -f kinboard-init kinboard-db kinboard-db-init kinboard-rest \
            kinboard-webapp kinboard-go2rtc >/dev/null 2>&1 || true
          docker volume rm kinboard-db kinboard-storage kinboard-config >/dev/null 2>&1 || true
