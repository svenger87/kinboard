# Build the webapp from this source tree instead of pulling the published
# image:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Tagged kinboard-webapp:local so a local build is never mistaken for, or
# overwritten by, a pulled ghcr.io image (`docker compose pull` skips it).
#
# Nothing is baked in on purpose: the API address is the page's own origin
# and the browser sends no key (RFC-024 §4.6 step 3), so the anon key is no
# longer a build argument. Next still inlines any NEXT_PUBLIC_* value the
# code reads, so a clean checkout remains the safe place to build from.

services:
  webapp:
    image: kinboard-webapp:local
    pull_policy: build
    build:
      context: ..
      dockerfile: image/Dockerfile
      args:
        # Stamped into sw.js so open pages notice the new build. start.sh
        # exports the checkout's short sha; empty falls back to a timestamp.
        BUILD_REVISION: ${BUILD_REVISION:-}
