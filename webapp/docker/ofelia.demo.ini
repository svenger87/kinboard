# Ofelia Cron Configuration
# Runs automated tasks for Kinboard

# Run sync job inside webapp container
# Calls the /usr/local/bin/google-sync script built into the image
[job-exec "google-sync"]
schedule = @every 15m
container = kinboard-webapp
command = /usr/local/bin/google-sync
no-overlap = true

[job-exec "todo-reminders"]
schedule = 0 0 8 * * *
container = kinboard-webapp
command = /usr/local/bin/todo-reminders
no-overlap = true

[job-exec "process-notifications"]
schedule = @every 30s
container = kinboard-webapp
command = /usr/local/bin/process-notifications
no-overlap = true

[job-exec "schedule-event-reminders"]
schedule = @every 5m
container = kinboard-webapp
command = /usr/local/bin/schedule-event-reminders
no-overlap = true

[job-exec "sync-ics"]
schedule = @every 30m
container = kinboard-webapp
command = /usr/local/bin/sync-ics
no-overlap = true

[job-exec "pocket-money-accrue-interest"]
schedule = 0 30 0 * * *
container = kinboard-webapp
command = /usr/local/bin/pocket-money-accrue-interest
no-overlap = true

[job-exec "pocket-money-commit-interest"]
schedule = 0 0 * * * *
container = kinboard-webapp
command = /usr/local/bin/pocket-money-commit-interest
no-overlap = true

[job-exec "pocket-money-process-allowance"]
schedule = 0 0 * * * *
container = kinboard-webapp
command = /usr/local/bin/pocket-money-process-allowance
no-overlap = true

# ── DEMO ONLY ─────────────────────────────────────────────────────────────
# Superset of ofelia.ini (keep the jobs above in sync with it). The job below
# re-applies seed-demo.sql hourly so visitor changes on the shared public demo
# family (a settings PIN, edited/disconnected integrations, added/deleted
# items) don't persist. seed-demo.sql is a transactional wipe-and-reseed scoped
# to the demo family UUID. This file is mounted ONLY by docker-compose.demo.yml
# — it must never reach a real self-hoster's cron.
[job-exec "demo-config-reset"]
schedule = @every 1h
container = kinboard-db
command = psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /demo-reset/seed-demo.sql
no-overlap = true
