# Kinboard - Full Stack Docker Compose
#
#   db       Postgres (the supabase/postgres image: its roles and extensions
#            are what the schema and the row-level-security policies use)
#   rest     PostgREST — the browser's database API, reached through the
#            webapp at /rest/v1 on the app's own address
#   webapp   the app; also serves /rest/v1, uploaded files and live updates
#   cron     the scheduler for the webapp's jobs
#   go2rtc   camera streams
#
# Until 1.15 this also ran Kong, GoTrue, Realtime, Storage and imgproxy. The
# app used none of GoTrue or imgproxy, and the webapp now does what the other
# three did for it; see UPGRADING.md for what an existing install goes through.
#
# This file ships portable defaults — `docker compose up -d` pulls the
# published image and works on any host. To build the webapp from this
# source tree instead, add `-f docker-compose.build.yml`. For Traefik (TLS,
# routing), add `-f docker-compose.traefik.yml`.
#
# Configurable via .env (see .env.example).
#
# (Compose v2 ignores the top-level `version:` field and prints a
# deprecation warning on every up; omitted intentionally.)

# Container logs are unbounded by default: Docker's json-file driver keeps
# writing until the disk fills. Kong alone (before 1.15) logged one line per API request,
# which on a dashboard that polls comes to roughly 10-15 MB a day — a few
# gigabytes a year, inside Docker's storage, on a box that is meant to run
# untouched for years.
#
# 10 MB x 3 files caps each container at 30 MB while still leaving enough
# history to debug yesterday's problem. Applied to every service below via
# the YAML anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===================
  # PostgreSQL Database
  # ===================
  db:
    logging: *default-logging
    image: supabase/postgres:15.14.1.159
    container_name: ${PROJECT_NAME:-kinboard}-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
    volumes:
      - ${DATA_DIR:-./data}/db:/var/lib/postgresql/data
      # Mount our schema as `zz-init.sql` (NOT `init.sql`) so it runs
      # AFTER the supabase image's own `migrate.sh` in the postgres
      # entrypoint's lexical order. If we mounted as `init.sql`, our
      # script would run BEFORE migrate.sh has created the
      # `supabase_admin` role and the extensions' default-privileges
      # grant would fail with `ON_ERROR_STOP=1`, killing the entrypoint
      # before migrate.sh ever runs. Result: no supabase service roles,
      # rest crash-loops forever. The screenshot
      # demo stack works around this with an override; this is the
      # equivalent fix in the canonical compose so fresh installs work
      # out of the box.
      - ./init.sql:/docker-entrypoint-initdb.d/zz-init.sql
    networks:
      - kinboard

  # ===================
  # DB role-password alignment (one-shot)
  # ===================
  # The supabase/postgres image seeds `authenticator` (PostgREST's login role)
  # with an EMPTY password; only supabase_admin gets the real one from
  # migrate.sh. Without aligning it to POSTGRES_PASSWORD, rest crash-loops
  # forever with "password authentication failed for user authenticator".
  #
  # This used to be fixed by start.sh AFTER `up`, from the host — which meant
  # a bare `docker compose up` (no start.sh) silently broke with cascading
  # 503s and no hint why. Running it as a gated one-shot makes plain
  # `docker compose up` work on its own. The dependent services below wait
  # for this to complete (service_completed_successfully). Idempotent.
  db-init:
    logging: *default-logging
    image: supabase/postgres:15.14.1.159
    container_name: ${PROJECT_NAME:-kinboard}-db-init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    # Connect as supabase_admin — the actual bootstrap superuser in the
    # supabase/postgres image (the `postgres` role is NOT a superuser and
    # can't modify the reserved `authenticator` role). migrate.sh sets
    # supabase_admin's password to POSTGRES_PASSWORD, and it already accepts
    # TCP+password connections. Wait until the supabase
    # migrations have actually created the `authenticator` role before
    # ALTERing it — on a first boot the db can report healthy mid-init.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for i in $$(seq 1 60); do
          if psql -h db -p 5432 -U supabase_admin -d postgres -tAc \
               "SELECT 1 FROM pg_roles WHERE rolname='authenticator'" 2>/dev/null \
               | grep -q 1; then
            break
          fi
          echo "db-init: waiting for supabase roles to exist ($$i)…"
          sleep 2
        done
        psql -h db -p 5432 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 <<'SQL'
        ALTER USER authenticator WITH PASSWORD '${POSTGRES_PASSWORD}';
        SQL
        echo "db-init: authenticator password aligned."
    networks:
      - kinboard

  # ===================
  # PostgREST
  # ===================
  rest:
    logging: *default-logging
    image: postgrest/postgrest:v14.16
    container_name: ${PROJECT_NAME:-kinboard}-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      # `storage` was exposed for the storage-api container, which is gone.
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # Dropped with the v14 bump:
      #   PGRST_DB_USE_LEGACY_GUCS  — the option was removed in v12.0.0, so it
      #     has been inert since before this pin. JSON GUCs are the only mode.
      #   PGRST_APP_SETTINGS_*      — copies the signing secret into a session
      #     GUC that any function could read, and nothing in this database
      #     reads app.settings.* at all. Supabase still ships these lines; we
      #     don't need them.
    command: "postgrest"
    networks:
      - kinboard

  # ===================
  # Next.js Webapp
  # ===================
  webapp:
    logging: *default-logging
    # The published image. KINBOARD_TAG picks the channel or version (`next`
    # is the RC channel, `latest` the stable one, or a version like 1.15.0).
    # To build from this source tree instead: -f docker-compose.build.yml.
    image: ghcr.io/svenger87/kinboard:${KINBOARD_TAG:-latest}
    ports:
      - "${WEBAPP_PORT:-3001}:3000"
    volumes:
      # Uploaded files (lib/files/store.ts). The same directory the storage-api
      # container used, so the backup that archives it covers the new files
      # too and the entrypoint can hard-link the old objects across.
      - ${DATA_DIR:-./data}/storage:/var/lib/storage
    container_name: ${PROJECT_NAME:-kinboard}-webapp
    restart: unless-stopped
    # The scheduled jobs live here, on the container they run inside, rather
    # than in a config file listing a container by name.
    #
    # ofelia.ini hardcoded `container = kinboard-webapp`, which is the
    # production container's name. A test rig brought up its own cron
    # container, which read that file and dutifully executed every job —
    # calendar syncs, notifications, pocket-money interest — inside
    # PRODUCTION. Found while wondering why a heartbeat written by the rig's
    # cron never appeared in the rig's database: it was being written to the
    # wrong instance entirely.
    #
    # As labels the jobs cannot name the wrong container, because they are
    # attached to the right one.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.google-sync.schedule: "@every 15m"
      ofelia.job-exec.google-sync.command: "/usr/local/bin/google-sync"
      ofelia.job-exec.google-sync.no-overlap: "true"
      ofelia.job-exec.todo-reminders.schedule: "0 0 8 * * *"
      ofelia.job-exec.todo-reminders.command: "/usr/local/bin/todo-reminders"
      ofelia.job-exec.todo-reminders.no-overlap: "true"
      # The Heute-Motor. Every five minutes: the rules that care about minutes
      # cross their threshold once and stay true afterwards, so a finer
      # interval buys a more precise countdown and nothing else — and coarser
      # would let a morning reminder arrive after the school run.
      ofelia.job-exec.evaluate-attention.schedule: "@every 5m"
      ofelia.job-exec.evaluate-attention.command: "/usr/local/bin/evaluate-attention"
      ofelia.job-exec.evaluate-attention.no-overlap: "true"
      ofelia.job-exec.process-notifications.schedule: "@every 30s"
      ofelia.job-exec.process-notifications.command: "/usr/local/bin/process-notifications"
      ofelia.job-exec.process-notifications.no-overlap: "true"
      ofelia.job-exec.schedule-event-reminders.schedule: "@every 5m"
      ofelia.job-exec.schedule-event-reminders.command: "/usr/local/bin/schedule-event-reminders"
      ofelia.job-exec.schedule-event-reminders.no-overlap: "true"
      ofelia.job-exec.extend-event-series.schedule: "0 20 3 * * *"
      ofelia.job-exec.extend-event-series.command: "/usr/local/bin/extend-event-series"
      ofelia.job-exec.extend-event-series.no-overlap: "true"
      ofelia.job-exec.birthday-reminders.schedule: "0 0 7 * * *"
      ofelia.job-exec.birthday-reminders.command: "/usr/local/bin/birthday-reminders"
      ofelia.job-exec.birthday-reminders.no-overlap: "true"
      ofelia.job-exec.meal-prep-reminders.schedule: "0 0 18 * * *"
      ofelia.job-exec.meal-prep-reminders.command: "/usr/local/bin/meal-prep-reminders"
      ofelia.job-exec.meal-prep-reminders.no-overlap: "true"
      ofelia.job-exec.sync-ics.schedule: "@every 30m"
      ofelia.job-exec.sync-ics.command: "/usr/local/bin/sync-ics"
      ofelia.job-exec.sync-ics.no-overlap: "true"
      ofelia.job-exec.sync-caldav.schedule: "0 15,45 * * * *"
      ofelia.job-exec.sync-caldav.command: "/usr/local/bin/sync-caldav"
      ofelia.job-exec.sync-caldav.no-overlap: "true"
      # #407: the two minutes Settings → Bring! "Auto sync" promises. The
      # route skips families with it off, so this costs nothing without Bring!.
      ofelia.job-exec.sync-bring.schedule: "@every 2m"
      ofelia.job-exec.sync-bring.command: "/usr/local/bin/sync-bring"
      ofelia.job-exec.sync-bring.no-overlap: "true"
      # RFC-014 §5.2: daily, counted from container start so installs spread
      # across the day; the route fetches only for families whose last sync is
      # more than a week old.
      ofelia.job-exec.sync-school-holidays.schedule: "@every 24h"
      ofelia.job-exec.sync-school-holidays.command: "/usr/local/bin/sync-school-holidays"
      ofelia.job-exec.sync-school-holidays.no-overlap: "true"
      ofelia.job-exec.pocket-money-accrue-interest.schedule: "0 30 0 * * *"
      ofelia.job-exec.pocket-money-accrue-interest.command: "/usr/local/bin/pocket-money-accrue-interest"
      ofelia.job-exec.pocket-money-accrue-interest.no-overlap: "true"
      ofelia.job-exec.pocket-money-commit-interest.schedule: "0 0 * * * *"
      ofelia.job-exec.pocket-money-commit-interest.command: "/usr/local/bin/pocket-money-commit-interest"
      ofelia.job-exec.pocket-money-commit-interest.no-overlap: "true"
      ofelia.job-exec.pocket-money-process-allowance.schedule: "0 0 * * * *"
      ofelia.job-exec.pocket-money-process-allowance.command: "/usr/local/bin/pocket-money-process-allowance"
      ofelia.job-exec.pocket-money-process-allowance.no-overlap: "true"
      # #341: a task's due day closes when its next one arrives -- at the
      # family's midnight for a daily task -- so the pass runs often.
      ofelia.job-exec.close-task-days.schedule: "@every 15m"
      ofelia.job-exec.close-task-days.command: "/usr/local/bin/close-task-days"
      ofelia.job-exec.close-task-days.no-overlap: "true"
      ofelia.job-exec.purge-recycle-bin.schedule: "0 30 3 * * *"
      ofelia.job-exec.purge-recycle-bin.command: "/usr/local/bin/purge-recycle-bin"
      ofelia.job-exec.purge-recycle-bin.no-overlap: "true"
      ofelia.job-exec.purge-domain-events.schedule: "0 45 3 * * *"
      ofelia.job-exec.purge-domain-events.command: "/usr/local/bin/purge-domain-events"
      ofelia.job-exec.purge-domain-events.no-overlap: "true"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      # The browser reaches the API on the page's own address: the webapp
      # forwards /rest/v1 to PostgREST (src/lib/rest-proxy.ts), and server
      # code goes to it directly. API_EXTERNAL_URL and KINBOARD_ENTRY are no
      # longer read (there is no Kong to point them at).
      POSTGREST_URL: http://rest:3000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Where uploaded files live, inside the volume above.
      FILES_DIR: /var/lib/storage/files
      # Signs the short-lived family-scoped tokens the browser uses for its
      # direct PostgREST connection. Must be the same secret PostgREST
      # verifies with (PGRST_JWT_SECRET below), or nothing the app mints will
      # be accepted. Without it, joining a family fails outright — the join
      # route mints a token as part of the response.
      JWT_SECRET: ${JWT_SECRET}
      # Container timezone — used by server-side date/time formatting
      # (push notification bodies, cron timestamps, etc.). Without this,
      # the webapp container runs in UTC and push notifications for
      # local-time events show up off by the UTC offset (e.g. 08:00 CEST
      # → "06:00"). Self-hosters outside Europe/Berlin should set TZ
      # in .env to their household's IANA zone.
      TZ: ${TZ:-Europe/Berlin}
      # Public origin, used server-side to build absolute URLs (e.g. the
      # ICS calendar feed subscribe link) that must be reachable from
      # outside the Docker network. request.nextUrl.origin resolves to
      # the internal request URL behind a reverse proxy (Traefik), which
      # is wrong for links handed to external calendar apps.
      SITE_URL: ${SITE_URL}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      # The Location field's place search; empty is komoot's public Photon.
      PHOTON_URL: ${PHOTON_URL:-}
      # Optional override for the OpenWeatherMap API base URL — lets the
      # demo overlay redirect weather calls to a local mock so the
      # widget renders without burning a real API key. Defaults to the
      # real api.openweathermap.org when unset.
      OPENWEATHERMAP_BASE_URL: ${OPENWEATHERMAP_BASE_URL:-}
      IMMICH_API_URL: ${IMMICH_API_URL}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      # School holidays from the OpenHolidays API (RFC-014 §5). "off" turns
      # the sync off for the whole install: no request leaves the server.
      SCHOOL_HOLIDAY_SYNC: ${SCHOOL_HOLIDAY_SYNC:-}
      # Join/create attempts per client per minute. Unset keeps the production
      # caps (10 and 5); CI raises it because its tests join from one IP.
      SESSION_RATE_LIMIT_PER_MINUTE: ${SESSION_RATE_LIMIT_PER_MINUTE:-}
      # go2rtc for camera WebRTC streaming (internal Docker network)
      GO2RTC_URL: http://go2rtc:1984
      # Web Push Notifications (VAPID)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Demo mode: when set, /join shows a banner with this family code so
      # public-demo visitors can load the seeded household. Self-hosters
      # leave it unset.
      KINBOARD_DEMO_FAMILY_CODE: ${KINBOARD_DEMO_FAMILY_CODE:-}
      # Postgres credentials for the entrypoint's migration runner (so any
      # image update applies new schema without `start.sh migrate`) and for
      # the live-update feed's LISTEN connection (src/lib/realtime).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - kinboard

  # ===================
  # Cron Scheduler (Ofelia)
  # ===================
  cron:
    logging: *default-logging
    image: mcuadros/ofelia@sha256:efcbe2c5cf658a25de6443c1462d653f9cc03791d642e01fc6c638a00f97e492
    container_name: ${PROJECT_NAME:-kinboard}-cron
    restart: unless-stopped
    depends_on:
      - webapp
    # Jobs come from the webapp container's labels, and the scheduler is
    # filtered to the webapp container of THIS deployment.
    #
    # The filter is the important half. Label mode on its own would still find
    # every labelled Kinboard webapp on the host, so a rig's scheduler would
    # drive production's container — which is precisely the bug being replaced
    # here. PROJECT_NAME is the same variable container_name uses, so the
    # scheduler and its target cannot drift apart.
    command: daemon --docker --docker-filter "name=${PROJECT_NAME:-kinboard}-webapp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CRON_SECRET=${CRON_SECRET}
    networks:
      - kinboard

  # ===================
  # go2rtc (RTSP to WebRTC)
  # ===================
  go2rtc:
    logging: *default-logging
    image: alexxit/go2rtc:1.9.14
    container_name: ${PROJECT_NAME:-kinboard}-go2rtc
    restart: unless-stopped
    ports:
      # HTTP API + web console, bound to loopback. go2rtc's /api/streams
      # lists every source it is holding, and it masks only the values it
      # substituted from this file's environment variables — a camera added
      # at runtime is echoed back with its password in the URL. The webapp
      # reaches go2rtc as http://go2rtc:1984 over the Docker network and does
      # not use this mapping at all; set GO2RTC_HTTP_BIND=0.0.0.0 if you want
      # the console from another machine and are content with that.
      - "${GO2RTC_HTTP_BIND:-127.0.0.1}:${GO2RTC_HTTP_PORT:-1984}:1984"
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/udp"  # WebRTC UDP
    environment:
      - TZ=${TZ:-UTC}
      # Substituted into go2rtc.yaml at container start; see .env.example.
      - CAMERA_USER=${CAMERA_USER:-admin}
      - CAMERA_PASS=${CAMERA_PASS:-}
      - HIKVISION_HOST=${HIKVISION_HOST:-}
      - AMCREST_HOST=${AMCREST_HOST:-}
      - WEBRTC_LAN_IP=${WEBRTC_LAN_IP:-}
      - WEBRTC_PUBLIC_HOST=${WEBRTC_PUBLIC_HOST:-}
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    networks:
      - kinboard

networks:
  kinboard:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.200.0.0/24}
