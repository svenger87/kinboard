# Ofelia Cron Configuration
# Runs automated tasks for Kinboard

# Run sync job inside webapp container
# Calls the /usr/local/bin/google-sync script built into the image
[job-exec "google-sync"]
schedule = @every 15m
container = kinboard-webapp
command = /usr/local/bin/google-sync
no-overlap = true

[job-exec "todo-reminders"]
schedule = 0 0 8 * * *
container = kinboard-webapp
command = /usr/local/bin/todo-reminders
no-overlap = true

[job-exec "process-notifications"]
schedule = @every 30s
container = kinboard-webapp
command = /usr/local/bin/process-notifications
no-overlap = true

[job-exec "schedule-event-reminders"]
schedule = @every 5m
container = kinboard-webapp
command = /usr/local/bin/schedule-event-reminders
no-overlap = true

[job-exec "birthday-reminders"]
schedule = 0 0 7 * * *
container = kinboard-webapp
command = /usr/local/bin/birthday-reminders
no-overlap = true

[job-exec "meal-prep-reminders"]
schedule = 0 0 18 * * *
container = kinboard-webapp
command = /usr/local/bin/meal-prep-reminders
no-overlap = true

[job-exec "sync-ics"]
schedule = @every 30m
container = kinboard-webapp
command = /usr/local/bin/sync-ics
no-overlap = true

# Same 30-minute cadence as sync-ics, but pinned to :15 and :45 rather
# than "@every 30m" (which counts from daemon start) so the two calendar
# jobs never land on the same tick and contend for the events table.
[job-exec "sync-caldav"]
schedule = 0 15,45 * * * *
container = kinboard-webapp
command = /usr/local/bin/sync-caldav
no-overlap = true

[job-exec "pocket-money-accrue-interest"]
schedule = 0 30 0 * * *
container = kinboard-webapp
command = /usr/local/bin/pocket-money-accrue-interest
no-overlap = true

[job-exec "pocket-money-commit-interest"]
schedule = 0 0 * * * *
container = kinboard-webapp
command = /usr/local/bin/pocket-money-commit-interest
no-overlap = true

[job-exec "pocket-money-process-allowance"]
schedule = 0 0 * * * *
container = kinboard-webapp
command = /usr/local/bin/pocket-money-process-allowance
no-overlap = true

# Empties the recycle bin of anything past its family's retention window.
# 03:30 keeps it clear of the pocket-money jobs at 00:00 and 00:30.
[job-exec "purge-recycle-bin"]
schedule = 0 30 3 * * *
container = kinboard-webapp
command = /usr/local/bin/purge-recycle-bin
no-overlap = true
