# Kept so COMPOSE_FILES lines that name it keep working; since 1.15 it adds
# only one thing. docker-compose.yml itself runs the published image
# (ghcr.io/svenger87/kinboard:${KINBOARD_TAG}) — this file used to switch to
# it from a source build, and leaving it out quietly fell back to building
# whatever was on disk (#106). To build from source now, use
# docker-compose.build.yml instead.

services:
  webapp:
    # Pull from GHCR even if a local image with the same tag exists, so an
    # install always runs the published version it asked for.
    pull_policy: always
