_format_version: "2.1"
_transform: true

###
### Consumers / Users
###
consumers:
  - username: DASHBOARD
  - username: anon

###
### Access Control List
###
acls:
  - consumer: DASHBOARD
    group: admin
  - consumer: anon
    group: anon

